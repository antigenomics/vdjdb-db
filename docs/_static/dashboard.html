<!doctype html>
<meta charset="utf-8">
<title>VDJdb summary dashboard</title>
<!-- The reviewed master fragment is loaded unchanged; neutral image colours adapt for display. -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/semantic-ui@2.5.0/dist/semantic.min.css">
<style>
  :root { color-scheme: light dark; background: transparent; }
  body { margin: 0; background: transparent; color: #253444; font-family: Lato, "Helvetica Neue", Arial, sans-serif; }
  /* vdjdb-web renders /overview in a 1127 px content column. Match it, or the responsive image
     rule added for #460 cannot be judged here. */
  #frame { max-width: 1127px; margin: 0 auto; padding: 1rem 1.5rem; }
  #miss { display: none; padding: 2rem; color: #555; text-align: center; }
  #miss code { background: #eee; padding: .1em .3em; border-radius: 3px; }
  img { max-width: 100%; height: auto; }
  @media (prefers-color-scheme: dark) {
    body, #miss { color: #e5e9ef; }
    #miss code { background: #252d38; }
    .ui.table { background: transparent; color: #e5e9ef; border-color: #465362; }
    .ui.table thead th { background: #252d38; color: #e5e9ef; }
    .ui.celled.table tr td, .ui.celled.table tr th { border-color: #465362; }
  }
</style>

<div id="frame"></div>
<div id="miss">
  <p><strong>This build of the docs has no dashboard.</strong></p>
  <p>It is downloaded from the last successful database build on <code>master</code>.
     Render it yourself with<br>
     <code>uv run vdjdb summary --legacy out/legacy</code>, then open
     <code>summary/preview/</code>.</p>
</div>

<script>
  fetch("vdjdb_summary_embed.html")
    .then(r => r.ok ? r.text() : Promise.reject(new Error(String(r.status))))
    .then(async html => {
      const frame = document.getElementById("frame");
      frame.innerHTML = html;
      const scheme = matchMedia("(prefers-color-scheme: dark)");
      await Promise.all([...frame.querySelectorAll("img")].map(async image => {
        const original = image.src;
        await image.decode();
        const canvas = document.createElement("canvas");
        canvas.width = image.naturalWidth; canvas.height = image.naturalHeight;
        const context = canvas.getContext("2d");
        context.drawImage(image, 0, 0);
        const pixels = context.getImageData(0, 0, canvas.width, canvas.height);
        // Display only: retain coloured data pixels and the original light source.
        for (let i = 0; i < pixels.data.length; i += 4) {
          if (pixels.data[i] === pixels.data[i + 1] && pixels.data[i] === pixels.data[i + 2]) {
            pixels.data[i] = pixels.data[i + 1] = pixels.data[i + 2] = 255 - pixels.data[i];
          }
        }
        context.putImageData(pixels, 0, 0);
        const dark = canvas.toDataURL("image/png");
        const apply = () => { image.src = scheme.matches ? dark : original; };
        scheme.addEventListener("change", apply);
        apply();
      }));
    })
    .catch(() => { document.getElementById("miss").style.display = "block"; });
</script>
