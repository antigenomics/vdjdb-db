[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vdjdb-db"
version = "0.1.0"
description = "Build, proofread and release the VDJdb T-cell receptor specificity database"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Mikhail Shugay", email = "mikhail.shugay@gmail.com" }]
keywords = ["immunology", "tcr", "vdjdb", "airr", "epitope", "bioinformatics"]

dependencies = [
    "polars>=1.20",
    "typer>=0.12",
    # arda is imported directly for cdr3fix / germline anchors / D inference. vdjtools pulls it
    # transitively, but a direct import deserves a direct dependency.
    "arda-mapper>=2.30.1",
    # vdjtools supplies the AIRR schema/IO, the recombination model (junction-nt inference, Pgen)
    # and TCRNET. Its own core deps are arda-mapper, seqtree and vdjmatch.
    "vdjtools>=3.13",
]

[project.optional-dependencies]
# Motif inference only. mirpy pulls kneed/matplotlib/seaborn/lifelines via its own [bench] extra,
# which the data build has no use for -- keep them out of the assembly container.
# pandas is here for exactly two call sites, both under `validate/`: `metrics_lib.py`, vendored from
# TCREMP, and the single `motif_bench.to_pandas()` that feeds it. **The build itself has no pandas
# dependency and must not acquire one** -- every stage from `chunks/` to the three shipped formats is
# polars.
#
# Why it is still pandas, measured 2026-09-28 on a 143,497-row TRB cohort: `mb.score` (pandas) 2.100 s
# against `qscore.score` (polars) 0.283 s on the same data, so about 21 s of a ~30-minute build, 1.2 %.
# `CLAUDE.md` section 10 says not to restructure what is not the bottleneck, and the bottleneck is
# `infer_nt` at 86 % (antigenomics/vdjtools#181). The reason to keep it is comparability with the
# benchmark's `metrics_full.tsv`, which is what phase 11's acceptance criterion rests on -- weakened,
# but not removed, by the one deliberate divergence in that module (the tie-break, antigenomics/tcremp#8).
# Rewriting it in polars is a rung-1 change worth about 1 % of the build and risks the comparison; it
# becomes worth doing if that module ever stops being an anchor.
motifs = ["mirpy-lib[bench]>=3.0", "python-igraph>=0.11", "scikit-learn>=1.4", "pandas>=2.0", "pyarrow>=16", "clustereval>=0.2"]
test = ["pytest>=8", "hypothesis>=6", "airr>=1.5"]
# The dashboard checker. Pillow and scipy arrive transitively through mirpy-lib[bench] today, which
# means an upstream dependency change would silently disable the style and perceptual layers rather
# than fail -- a check that quietly downgrades itself is worse than no check. Declared so it cannot.
summary = ["pillow>=10", "numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]
# The clustering bake-off under docs/tuning/ only. Lumbermark is measured, not shipped
# (docs/clustering.md section 9), so it must not reach the build container -- `uv sync --extra
# tuning` when re-running the sweeps, never the default install.
tuning = ["lumbermark>=0.9", "quitefastmst>=0.9"]
# The documentation site. `myst-parser` because `docs/denoising.md` and `docs/clustering.md` are
# normative Markdown carrying `$...$` maths -- they are converted in place, not rewritten as rst.
docs = ["sphinx>=7", "pydata-sphinx-theme>=0.15", "myst-parser>=3"]
dev = ["ruff>=0.6", "mypy>=1.11"]

[project.scripts]
vdjdb = "vdjdb.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vdjdb"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
# Four kinds of code that must not be reformatted, for four different reasons:
#   attic          retired reference. `tests/unit/test_schema.py` parses the Groovy at test time.
#   _legacy_fixer  a verbatim copy, and still live -- the k-mer V/J guesser arda does not replace.
#   metrics_lib    vendored verbatim so the benchmark metrics stay comparable with the reference.
#   processing     a curator's one-off notebooks, not library code.
exclude = ["attic", "src/vdjdb/annotate/_legacy_fixer",
           "src/vdjdb/validate/metrics_lib.py", "processing"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# typer declares options as call expressions in defaults; that is the framework's idiom, not a bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# re-export surface: the names are the point
"src/vdjdb/schema/__init__.py" = ["F401"]

[tool.mypy]
# 3.12 rather than the 3.11 floor in `requires-python`: numpy's own stubs use a 3.12 `type`
# statement, and a syntax error in a followed stub stops the check before it reaches our code --
# `follow_imports = "skip"` cannot suppress it. Nothing here uses 3.12-only syntax; a CI job on the
# real floor is what would catch that, not the type checker's assumed version.
python_version = "3.12"
# Strict where a mistake is unrecoverable rather than merely wrong: the column registry every output
# projects from, the coordinate conversions between the four spaces documented in ROADMAP.md, and the
# identifiers, which ship to consumers and cannot be renumbered once published.
files = ["src/vdjdb/schema", "src/vdjdb/convert", "src/vdjdb/identity"]
strict = true


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "release: compares against a real VDJdb release zip; needs VDJDB_REFERENCE_ZIP. Nightly only.",
]
