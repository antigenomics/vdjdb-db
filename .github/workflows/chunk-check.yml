# The gate every chunk submission hits. Budget: under 3 minutes.
#
# runs-on is ubuntu-latest ALWAYS and must never be made retargetable: this workflow is triggered by
# pull requests from forks, and running fork code on a self-hosted runner in a public repository is
# the textbook way to lose the runner. The heavy jobs live in build.yml, which is guarded.
name: chunk-check

on:
  # EVERY pull request, with no path filter, because this is a REQUIRED status check: a filtered
  # workflow does not run on a PR that misses its paths, the required check stays pending, and the
  # PR is blocked forever. A docs-only PR would have hit that.
  #
  # The cost is small and the behaviour is better: with no chunks changed the QC step falls back to
  # the whole corpus, which takes seconds, so every PR validates the data it is sitting on.
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: chunk-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        # `test` as well as `dev`: the guard step below runs pytest, which is in the `test`
        # extra, and without it the step fails to spawn rather than failing a check. The same
        # gap `8c8384d` closed in the docs job.
        run: uv sync --frozen --extra dev --extra test

      - name: Lint and type-check
        run: |
          uv run ruff check src/
          uv run mypy

      - name: Which chunks changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- chunks/ > changed.txt
          else
            git ls-files chunks/ > changed.txt
          fi
          echo "count=$(wc -l < changed.txt)" >> "$GITHUB_OUTPUT"
          cat changed.txt

      # TCRvdb / MATCHMAKERS is proprietary and non-redistributable. This fails the build if a copy
      # ever reaches the repository, by filename or by column fingerprint. See docs/outputs.md.
      - name: Guard against proprietary data
        run: uv run pytest tests/unit/test_guard.py -q

      # Strict: a failing chunk exits non-zero, restoring the behaviour the Groovy build had and
      # the Python port replaced with warnings.warn. Measured after the header normalisation of
      # phase 3: 230 of 230 chunks and 203,308 of 203,308 rows are clean, so there is no quarantine
      # list to grandfather. CRLF, unknown columns, non-PMID references and within-chunk duplicates
      # stay advisory -- they are reported, and do not block an unrelated submission.
      - name: Chunk QC
        run: |
          if [ -s changed.txt ]; then
            uv run vdjdb qc $(cat changed.txt) --report qc-report.tsv
          else
            uv run vdjdb qc --report qc-report.tsv
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qc-report
          path: qc-report.tsv
          retention-days: 14

      # What the submitter needs to see, on the pull request itself. The job already had
      # `pull-requests: write` and never used it, so until now a bad chunk meant opening the log or
      # downloading the artifact. One comment, updated in place on every push, so a branch with ten
      # pushes does not leave ten comments.
      - name: Summarise for the pull request
        if: always() && github.event_name == 'pull_request'
        run: |
          python3 - <<'PY' > comment.md
          import csv, pathlib, collections
          changed = [l.strip() for l in pathlib.Path("changed.txt").read_text().splitlines() if l.strip()]
          rows = list(csv.DictReader(open("qc-report.tsv"), delimiter="\t")) \
              if pathlib.Path("qc-report.tsv").exists() else []
          print("## chunk-check\n")
          if changed:
              print(f"**{len(changed)} chunk file(s) changed.**\n")
              print("| Chunk | Rows |")
              print("|---|---:|")
              for c in sorted(changed):
                  p = pathlib.Path(c)
                  n = max(sum(1 for _ in p.open(encoding="utf-8", errors="replace")) - 1, 0) if p.exists() else 0
                  print(f"| `{p.name}` | {n:,} |")
              print()
          else:
              print("No chunk files changed; the whole corpus was validated instead.\n")
          if rows:
              by = collections.Counter(r["code"] for r in rows)
              print(f"### {len(rows)} QC finding(s)\n")
              print("| Rule | Count | First example |")
              print("|---|---:|---|")
              for code, n in by.most_common():
                  first = next(r for r in rows if r["code"] == code)
                  where = f"{pathlib.Path(first['file']).name}:{first['row']}" if first.get("row") else pathlib.Path(first["file"]).name
                  print(f"| `{code}` | {n} | {where} - {first['detail'][:90]} |")
              print()
              print("A rule that blocks the merge fails the job above; the rest are advisory.")
          else:
              print("**No QC findings.**")
          PY
          cat comment.md

      - name: Post or update the comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- chunk-check -->';
            const body = marker + '\n' + fs.readFileSync('comment.md', 'utf8');
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const list = await github.rest.issues.listComments({owner, repo, issue_number});
            const mine = list.data.find(c => c.body && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({owner, repo, comment_id: mine.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number, body});
