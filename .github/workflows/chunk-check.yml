# The gate every chunk submission hits. Budget: under 3 minutes.
#
# runs-on is ubuntu-latest ALWAYS and must never be made retargetable: this workflow is triggered by
# pull requests from forks, and running fork code on a self-hosted runner in a public repository is
# the textbook way to lose the runner. The heavy jobs live in build.yml, which is guarded.
name: chunk-check

on:
  # EVERY pull request, with no path filter, because this is a REQUIRED status check: a filtered
  # workflow does not run on a PR that misses its paths, the required check stays pending, and the
  # PR is blocked forever. A docs-only PR would have hit that.
  #
  # The cost is small and the behaviour is better: with no chunks changed the QC step falls back to
  # the whole corpus, which takes seconds, so every PR validates the data it is sitting on.
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: chunk-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        # `test` as well as `dev`: the steps below run pytest, which is in the `test` extra, and
        # without it they fail to spawn rather than failing a check. The same gap `8c8384d` closed
        # in the docs job.
        #
        # `motifs` because the unit suite covers the clustering: five tests in `test_motifs.py`
        # reach Leiden and HDBSCAN, and `test_metrics.py` imports the vendored `metrics_lib`, which
        # pulls sklearn at module level. Without it those skip, and a check that quietly downgrades
        # itself is worse than no check -- the reasoning `pyproject.toml` already applies to the
        # `summary` extra. Measured: 628 of 629 unit tests, 27 s.
        run: uv sync --frozen --extra dev --extra test --extra motifs

      # `ruff check .`, not `src/`: `tests/` is a third of the Python in the repository and was
      # unlinted, so an unsorted import block in a test passed CI and was caught only by someone
      # running ruff over the tree by hand.
      - name: Lint and type-check
        run: |
          uv run ruff check .
          uv run mypy

      # The unit suite runs on no pull request otherwise. `build.yml` runs it, but its push trigger
      # has a paths filter, so a change confined to `tests/**` or `docs/**` reached `dev` and then
      # `master` with 629 tests never executed anywhere -- which is how this gap was found. 8 s
      # locally, well inside the 3-minute budget, and it subsumes the guard step below (kept
      # separate so a failure names the proprietary-data guard rather than a test id).
      # pandoc, because five tests in `test_summary.py` are `skipif(shutil.which("pandoc") is None)`
      # and this job installed none, so they skipped on every pull request and ran on every laptop.
      # Pinned to the version `build.yml` pins: the extractor asserts on pandoc-shaped output, so a
      # different version is a different assertion.
      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.10'

      # Whole-corpus QC, before the unit tests rather than after: `test_qc_advisories.py` reads
      # `out/reports/qc-summary.tsv` and skips when it is absent, and this job produced it late, at
      # the repository root, and only for the changed chunks. So the four advisory gates skipped on
      # every pull request while their own docstring said this is the tier that runs them. 1.0 s
      # over all 230 chunks; `--no-strict` because the strict verdict belongs to the Chunk QC step
      # below, which reports it per chunk.
      - name: QC counts for the advisory gates
        run: uv run vdjdb qc --no-strict --report out/reports/qc.tsv

      - name: Unit tests
        run: uv run pytest tests/unit -q

      - name: Which chunks changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # --diff-filter=ACMR: added, copied, modified, renamed, never Deleted. A pull request
            # that withdraws a chunk lists a path that no longer exists, and `vdjdb qc` opened it
            # and died with a FileNotFoundError traceback instead of reporting anything.
            git diff --name-only --diff-filter=ACMR \
              "origin/${{ github.base_ref }}...HEAD" -- chunks/ > changed.txt
          else
            git ls-files chunks/ > changed.txt
          fi
          echo "count=$(wc -l < changed.txt)" >> "$GITHUB_OUTPUT"
          cat changed.txt

      # TCRvdb / MATCHMAKERS is proprietary and non-redistributable. This fails the build if a copy
      # ever reaches the repository, by filename or by column fingerprint. See docs/outputs.md.
      - name: Guard against proprietary data
        run: uv run pytest tests/unit/test_guard.py -q

      # Strict: a failing chunk exits non-zero, restoring the behaviour the Groovy build had and
      # the Python port replaced with warnings.warn. Measured after the header normalisation of
      # phase 3: 230 of 230 chunks and 203,308 of 203,308 rows are clean, so there is no quarantine
      # list to grandfather. CRLF, unknown columns, non-PMID references and within-chunk duplicates
      # stay advisory -- they are reported, and do not block an unrelated submission.
      - name: Chunk QC
        run: |
          if [ -s changed.txt ]; then
            # xargs, not `$(cat ...)`: an unquoted substitution splits a submitter's filename on
            # spaces into paths that do not exist, which `qc` reports as the *advisory* missing-file
            # rule - so the chunk is never validated and the job stays green.
            tr '\n' '\0' < changed.txt | xargs -0 uv run vdjdb qc --report qc-report.tsv
          else
            uv run vdjdb qc --report qc-report.tsv
          fi

      # Well-formed is not the same question as "the chunk the curator meant". A mistyped epitope
      # passes every QC rule and silently becomes a new epitope entry, which is how `epitopes` came
      # to hold 13 peptides under two species (#633). This assembles the corpus - 9.9 s over 192,793
      # records - and stops before the annotation stages, which cost ten times as much and change
      # nothing a curator is deciding. `continue-on-error`: a report is not a gate, and `vdjdb qc`
      # above is what fails the job.
      # Pull requests only. On a push `changed.txt` is `git ls-files chunks/` - all 231 files - so the
      # report would treat the whole corpus as the submission, leaving nothing to compare it against
      # and calling every value in VDJdb new. The comment is posted on pull requests anyway.
      - name: What the chunk contributes
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          if [ -s changed.txt ]; then
            tr '\n' '\0' < changed.txt \
              | xargs -0 uv run vdjdb submission --out submission.md > /dev/null
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qc-report
          path: qc-report.tsv
          retention-days: 14

      # What the submitter needs to see, on the pull request itself. The job already had
      # `pull-requests: write` and never used it, so until now a bad chunk meant opening the log or
      # downloading the artifact. One comment, updated in place on every push, so a branch with ten
      # pushes does not leave ten comments.
      - name: Summarise for the pull request
        if: always() && github.event_name == 'pull_request'
        run: |
          python3 - <<'PY' > comment.md
          import csv, pathlib, collections
          # `if: always()`, and `changed.txt` is written after the lint and unit-test steps - so a
          # failure there used to add a second red step with a traceback and post an empty comment.
          _c = pathlib.Path("changed.txt")
          changed = [l.strip() for l in _c.read_text().splitlines() if l.strip()] if _c.exists() else []
          rows = list(csv.DictReader(open("qc-report.tsv"), delimiter="\t")) \
              if pathlib.Path("qc-report.tsv").exists() else []
          print("## chunk-check\n")
          if changed:
              print(f"**{len(changed)} chunk file(s) changed.**\n")
              print("| Chunk | Rows |")
              print("|---|---:|")
              for c in sorted(changed):
                  p = pathlib.Path(c)
                  n = max(sum(1 for _ in p.open(encoding="utf-8", errors="replace")) - 1, 0) if p.exists() else 0
                  print(f"| `{p.name}` | {n:,} |")
              print()
          else:
              print("No chunk files changed; the whole corpus was validated instead.\n")
          if rows:
              by = collections.Counter(r["code"] for r in rows)
              print(f"### {len(rows)} QC finding(s)\n")
              print("| Rule | Count | First example |")
              print("|---|---:|---|")
              for code, n in by.most_common():
                  first = next(r for r in rows if r["code"] == code)
                  where = f"{pathlib.Path(first['file']).name}:{first['row']}" if first.get("row") else pathlib.Path(first["file"]).name
                  print(f"| `{code}` | {n} | {where} - {first['detail'][:90]} |")
              print()
              print("A rule that blocks the merge fails the job above; the rest are advisory.")
          else:
              print("**No QC findings.**")
          # Written by `vdjdb submission`, which is `continue-on-error` - so its absence means the
          # assembly did not finish, and the QC section above is still the report that matters.
          _s = pathlib.Path("submission.md")
          if _s.exists():
              print()
              print(_s.read_text())
          PY
          cat comment.md

      # `continue-on-error`: on a pull request from a fork the token is read-only whatever the
      # `permissions:` block says, so posting returns 403. Forks are the population this job exists
      # for, and failing to comment must not read as failing the check.
      - name: Post or update the comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- chunk-check -->';
            const body = marker + '\n' + fs.readFileSync('comment.md', 'utf8');
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const list = await github.rest.issues.listComments({owner, repo, issue_number});
            const mine = list.data.find(c => c.body && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({owner, repo, comment_id: mine.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number, body});
