# The specification site -> https://docs.isalgo.dev/vdjdb-db/
#
# Pages is already provisioned for this repository with `build_type: workflow`, so there is no
# setup step -- this workflow is the deployment path.
#
# Two things here are deliberate and easy to undo by accident:
#
#   `sphinx-build -E` forces a full environment rebuild on every run. The schema tables, the
#   vocabularies and the score rules are DIRECTIVES that import `vdjdb.schema` while a page
#   renders, and Sphinx's incremental build keys on source mtime -- so a change to the registry
#   with no change to a `.md` file would publish the previous build's tables. Measured: it does.
#
#   The dashboard download is `continue-on-error`. A 30-minute database build must never block a
#   typo fix in the docs, so a missing artifact falls back to the committed placeholder.
name: docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'src/vdjdb/schema/**'
      - 'src/vdjdb/score/**'
      # The extension's tests run in this workflow and nowhere else, so a change to them
      # has to trigger it -- otherwise the one job that covers them never sees the change.
      - 'tests/unit/test_docs.py'
      - '.github/workflows/docs.yml'
      - 'pyproject.toml'
  # A chunk pushed to master rebuilds the dashboard in `build.yml`, but nothing above triggers on
  # `chunks/**`, so without this the published dashboard would keep showing the fragment from the
  # last docs change. Redeploy whenever a database build on master succeeds.
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  sphinx:
    # A failed build has no dashboard artifact to publish.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        # --extra test as well: the step below runs pytest, and `--extra docs` alone does not
        # provide it. Measured on run 36282458490, the first time that step ever executed.
        run: uv sync --extra docs --extra test

      # The rendered dashboard fragment, from the last successful database build. Optional by
      # design: `docs/_static/dashboard.html` is a committed placeholder that says so.
      - name: Fetch the dashboard fragment
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          name: summary-fragment
          path: docs/_static/
          if_no_artifact_found: warn

      # The docs extension's own tests run HERE, where docutils exists. The database build skips
      # the import test for want of Sphinx, so without this step nothing would exercise it.
      - name: Test the docs extension
        run: uv run pytest tests/unit/test_docs.py -q

      - name: Build
        run: uv run sphinx-build -E -W --keep-going -b html docs docs/_build/html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: sphinx
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
