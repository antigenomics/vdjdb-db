# The full database build: tables, every projection, motifs, the dashboard, and the release assets.
#
# Reusable (`workflow_call`) so `release.yml` runs exactly this and not a second copy of it. The
# runner is an input rather than a literal, which is what lets phase 15 point the heavy job at
# aldan3 without forking the workflow -- `fromJSON` because a multi-label self-hosted target is a
# JSON array and `runs-on: ${{ inputs.runner }}` cannot express one.
#
# Guarded against fork pull requests. `chunk-check.yml` is the job forks trigger and it is pinned to
# `ubuntu-latest` always; this one must never run their code on anything else.
name: build

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: '"ubuntu-latest"'
      tag:
        description: Release tag; when set, the release assets are built and uploaded.
        type: string
        default: ''
      previous:
        description: Previous release tag. Without it `vdjdb release` writes no RELEASE_NOTES.md,
          and `release.yml` publishes with `--notes-file`, so the release would fail after the
          approval and a 30-minute build.
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      runner:
        type: string
        default: '"ubuntu-latest"'
  # PRs targeting master only. `master` receives merges from `dev` (and `hotfix/*`) and nothing
  # else, so this is one build per release-ward merge -- and a required status check has to be
  # able to run on the pull request it gates, or it blocks every PR forever. That is why the
  # ROADMAP applies branch protections last.
  pull_request:
    branches: [master]
  push:
    branches: [dev, master]
    paths:
      - 'chunks/**'
      - 'patches/**'
      - 'proofreading/**'
      - 'src/vdjdb/**'
      - 'summary/**'
      - 'pyproject.toml'
      - '.github/workflows/build.yml'
      # `tests/**`: this job is the only place the `release` marks run at all, and the only place a
      # timing assertion is measured on the 4-vCPU machine its verdict depends on. Without this a
      # change to a test could only ever be checked by the unit subset `chunk-check` runs, which is
      # how a bar calibrated on a 16-core laptop reached `dev` and failed here (ROADMAP_local §52).
      - 'tests/**'
      # `rules/**`: the declared baselines every gate compares against -- `expected_diffs.toml` for
      # the release comparison and `motif_metrics.tsv` for the motif metrics. Editing one is exactly
      # the change that has to re-run the comparison, and until now it triggered nothing, so a
      # loosened baseline would have been checked by no build at all.
      - 'rules/**'
      # `registry/**`: the same argument for `records.tsv`. It is the committed record-identity input,
      # `tests/release/test_registry_is_current.py` is the only thing that gates it, and that test
      # carries the `release` mark so it runs here and nowhere else -- so a commit touching only the
      # registry was checked by no build. #672 is what that costs: it sat 592 amendments stale and
      # nothing noticed.
      - 'registry/**'
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  # The event is in the key because `release.yml` calls this workflow, and in a called workflow
  # `github.ref` is the caller's - so a push to master during a release would share the group and
  # one would cancel the other mid-flight.
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(inputs.runner || '"ubuntu-latest"') }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Pinned, not `release`: an R minor upgrade changed `guide = F`, `size =` and `..count..`
      # under this document once already. `use-public-rspm` gives binaries, so no -dev headers.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true

      # `setup-r` does NOT bring pandoc, and rmarkdown needs it: the first run past the arda fix
      # died with "pandoc version 1.12.3 or higher is required and was not found". Pinned to the
      # version the fingerprint in `summary/fingerprint.json` was recorded against -- pandoc
      # decides the fragment's markup, so an unpinned upgrade moves the thing being checked.
      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.10'

      - name: R packages
        # The list and the snapshot date live in the script, not here -- and a multi-line
        # `Rscript -e` in a YAML block scalar does not work: the continuations reach R as literal
        # backslashes. Measured on run 36267742981.
        run: Rscript summary/install-packages.R

      - name: Install
        run: uv sync --extra motifs --extra test --extra summary

      # `--report` so the per-rule advisory counts are written, not only printed. The gate on them is
      # in tests/unit/test_qc_advisories.py and runs in the Tests step below.
      #
      # It runs here rather than in `chunk-check` on purpose: that job QCs only the *changed* chunks,
      # so its counts are partial and comparing them against a whole-corpus baseline would fail on
      # every ordinary submission.
      - name: QC
        run: |
          . .github/stage-timing.sh
          stage proofread uv run vdjdb qc --strict --report out/reports/qc.tsv

      - name: Presentation reference input
        run: uv run vdjdb epitope-reference --out out/inputs

      - name: Assemble
        run: |
          . .github/stage-timing.sh
          stage assemble uv run vdjdb build --out out/ --pmhc-reference out/inputs/pmhc/pmhc_full.tsv.gz --epitope-jobs 4
          stage emit-legacy uv run vdjdb make legacy --tables out/tables --out out/legacy
          stage emit-airr uv run vdjdb convert airr --tables out/tables --out out/airr

      # Available before motifs/dashboard finish, so a new assembly stage can be measured
      # on the CI host before its timing declaration is reviewed.
      - name: Assembly profile
        uses: actions/upload-artifact@v4
        with:
          name: assemble-profile
          path: out/reports/build-timings.tsv
          retention-days: 7
          if-no-files-found: error

      # Six of the seven identity invariants (ROADMAP.md section 10.5). The seventh, that a
      # permuted chunk order changes no id, is a property of two builds and runs as a unit test on a
      # fixture rather than by building twice here. `--previous` is absent until a release ships a
      # lifecycle asset; the checks that need history skip rather than fail.
      - name: Identity
        run: uv run vdjdb identity check --tables out/tables

      # The corpus is offline: the word family needs `corpus/text_terms.tsv`, a committed input
      # refreshed by its own pull request, and the other eleven families come from `chunks/`.
      - name: Corpus
        run: uv run vdjdb corpus build --tables out/tables --out out/corpus

      - name: Motifs
        run: |
          . .github/stage-timing.sh
          stage motifs uv run vdjdb motifs --tables out/tables --out out/motifs

      - name: Dashboard
        run: |
          . .github/stage-timing.sh
          stage summary uv run vdjdb summary --legacy out/legacy
          mkdir -p out/summary
          cp summary/vdjdb_summary_embed.html out/summary/

      # The docs site embeds this; `docs.yml` downloads it with `continue-on-error`, so a failure
      # here degrades the dashboard tab to its placeholder rather than blocking a docs build.
      - uses: actions/upload-artifact@v4
        with:
          name: summary-fragment
          path: summary/vdjdb_summary_embed.html
          retention-days: 30

      # Every bundle member resolved against the tree this build produced, rather than against the
      # declaration. `PRIMARY` read its four motif members from `motifs_new/`, the output directory
      # of the clustering sweeps under docs/tuning/, so `vdjdb release` raised on the primary zip and
      # nothing noticed: the `Release assets` step below runs only on a dispatch that passes a tag,
      # and the unit test builds its fixture from the same declaration it is checking. This step
      # costs a second and needs no tag.
      - name: Release layout
        run: |
          . .github/stage-timing.sh
          stage release-layout uv run python -c "
          from pathlib import Path
          from vdjdb.release import bundle, manifest
          bundle.stage(Path('out'))
          for b in manifest.BUNDLES:
              print(b.role, len(manifest.resolve(b, Path('out'), '0.0.0')), 'members')
          "

      # Both the release comparison and tests/release/ need a published release to compare with,
      # and until 2026-09-27 neither had one: VDJDB_REFERENCE_ZIP was set in no workflow, so all 17
      # checks in tests/release/test_reference_contract.py skipped everywhere, including this
      # scheduled build. Those are the checks that stop a column moving in the motif files, which
      # vdjdb-web reads by position, and stop vdjdb.meta.txt disagreeing with vdjdb.txt.
      #
      # Line 1 of latest-version.txt is the published legacy zip. Downloading it is fetching an
      # input, not caching a result (hard rule 9).
      - name: Reference release
        run: |
          URL=$(head -1 latest-version.txt)
          [ -n "$URL" ] || { echo "::error::latest-version.txt line 1 is empty"; exit 1; }
          # Retried: an unretried 41 MB fetch is a single transient 5xx away from failing this step,
          # and everything downstream of it - the comparison, the motif metrics and the release half
          # of the test suite - never runs.
          #
          # `--retry-connrefused`, not `--retry-all-errors`: the latter needs curl 7.71 and aldan3
          # ships 7.68, so a self-hosted runner there (phase 15) would fail on the flag itself rather
          # than on anything it was meant to survive. Measured 2026-09-28 on a `short`-partition node.
          # It is also the better flag here - `--retry-all-errors` would retry a 404 five times, and a
          # reference zip that is not published should fail on the first attempt.
          curl -fsSL --retry 5 --retry-connrefused --retry-delay 5 -o reference.zip "$URL"
          ls -l reference.zip

      # The comparison runs on the **assembled legacy zip**, not on out/legacy, and on all twelve of
      # its members rather than five.
      #
      # It named five with `--only` until 2026-09-29, because a candidate member the reference has
      # not got failed the file-set pass outright and the two motif files reported 101,877
      # unattributed cells. Both are declared now: `[members]` covers the two new TCREMP tables and
      # `[measured_elsewhere]` names the instrument that gates each member this comparison cannot
      # judge, with its reason. So the thing compared is the file a consumer downloads, and the seven
      # members that were never looked at are at least read, digested and counted.
      #
      # `candidate` rather than a version: no tag is dispatched on a scheduled build, and the zip is
      # an input to this step, not an asset. `Release layout` above already ran `bundle.stage`, so
      # LICENSE and latest-version.txt are in place.
      #
      # Both metadata files are compared here as of 2026-09-27. They are keyed on the column name
      # rather than the line number, so the inserted TCR_hash row reads as one added row instead of
      # eight changed lines, and rules/expected_diffs.toml declares the rest.
      - name: Compare against the last release
        run: |
          . .github/stage-timing.sh
          stage release-zip uv run python -c "
          from pathlib import Path
          from vdjdb.release import manifest
          print(manifest.write_zip(manifest.LEGACY, Path('out'), Path('out'), 'candidate'))
          "
          stage release-compare uv run vdjdb diff reference.zip out/vdjdb-legacy-candidate.zip \
            --report out/reports/release-diff.md \
            --json out/reports/release-diff.json

      # Three sources, one cohort, one code path: the last legacy release, the latest release
      # (the same file until one ships after 2026-06-03) and what this build produced. Both gates run
      # -- `current-*` against `latest`, and every source against rules/motif_metrics.tsv.
      #
      # This step exists because the motif metrics used to be computed inside test assertions and
      # thrown away, so the three chunk merges of 2026-09-28 moved the comparator's Q by 0.0042 and
      # its retention by 0.0059 inside the assertion slack and nobody learned the new values. The
      # report is written to the step summary whether or not anything regressed: the number that did
      # not trip a gate is the one nobody would otherwise ever see.
      - name: Motif metrics
        run: |
          uv run vdjdb motif-metrics --tables out/tables --motifs out/motifs \
            --legacy reference.zip --out out/reports
        continue-on-error: false

      # The build writes its own profile now, so a stage that doubles is visible in the run that did
      # it rather than in a hand-made profile weeks later (ROADMAP_local §49 was the hand-made one).
      # Seconds are recorded and not gated - they are a property of the runner; `share` is gated in
      # tests/release/test_build_timings.py, because a ratio inside one run cancels host speed.
      - name: QC advisory counts
        if: always()
        run: |
          { echo '### QC findings by rule'; echo; echo '```'; \
            cat out/reports/qc-summary.tsv 2>/dev/null || echo '(not produced)'; \
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The two reports that replaced `vdjdb_full_gene_broken.txt` and `vdjdb_full_cdr3aa_broken.txt`.
      # `tests/release/test_legacy_proofreading_parity.py` gates them; this is where a reviewer sees
      # the counts without downloading the artifact.
      - name: Proofreading counts
        if: always()
        run: |
          { echo '### Proofreading findings'; echo; echo '```'; \
            echo "segment calls IMGT does not carry (chain-calls):"; \
            awk -F'\t' 'NR>1{n+=$5} END{print "  "n+0}' out/reports/nomenclature.tsv 2>/dev/null \
              || echo '  (not produced)'; \
            echo "non-canonical junctions (chains):"; \
            awk 'NR>1{n++} END{print "  "n+0}' out/reports/anchors.tsv 2>/dev/null \
              || echo '  (not produced)'; \
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"


      - name: Motif metrics report
        if: always()
        run: |
          { echo '### Motif metrics'; echo; \
            cat out/reports/motif-metrics.md 2>/dev/null || echo '(not produced)'; } \
            >> "$GITHUB_STEP_SUMMARY"


      - name: Tests
        env:
          VDJDB_REFERENCE_ZIP: reference.zip
        run: |
          . .github/stage-timing.sh
          stage tests uv run pytest -q

      - name: Build timings report
        if: always()
        run: |
          { echo '### Stage wall times'; echo; echo '```'; \
            cat out/reports/ci-stage-timings.tsv 2>/dev/null || echo '(not produced)'; \
            echo '```'; echo; \
            echo '### Build timings'; echo; echo '```'; \
            cat out/reports/build-timings.tsv 2>/dev/null || echo '(not produced)'; echo; \
            cat out/reports/motif-timings.tsv 2>/dev/null || echo '(not produced)'; \
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Everything the build measured, in one place. It was named `motif-metrics` and carried the
      # build timings, the QC summary and the release comparison as well, and it carried none of the
      # per-row reports - so a curator wanting to know *which* rows a finding covers had to rebuild
      # locally. `nomenclature.tsv` and `anchors.tsv` are the two that replaced the retired build's
      # `*_broken.txt` side files, which were the only proofreading output a curator ever had.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            out/reports/motif-metrics.tsv
            out/reports/motif-metrics.md
            out/reports/build-timings.tsv
            out/reports/ci-stage-timings.tsv
            out/reports/motif-timings.tsv
            out/reports/motifs_per_epitope.tsv
            out/reports/release-diff.json
            out/reports/release-diff.md
            out/reports/qc.tsv
            out/reports/qc-summary.tsv
            out/reports/nomenclature.tsv
            out/reports/harmonisation.tsv
            out/reports/anchors.tsv
            out/reports/j-calls.tsv
            out/reports/functionality.tsv
            out/reports/functionality-summary.tsv
            out/reports/presentation.tsv
            out/reports/presentation-summary.tsv
            out/reports/lookalikes.tsv
          retention-days: 90

      - name: Release assets
        if: inputs.tag != ''
        run: |
          uv run vdjdb release --tag "${{ inputs.tag }}" --build out --out out/release \
            ${{ inputs.previous && format('--previous {0}', inputs.previous) || '' }}

      - uses: actions/upload-artifact@v4
        if: inputs.tag != ''
        with:
          name: release-assets
          path: |
            out/release/*.zip
            out/release/manifest.json
            out/release/SHA256SUMS
            out/release/identity-lifecycle.tsv
            out/release/RELEASE_NOTES.md
          retention-days: 7
