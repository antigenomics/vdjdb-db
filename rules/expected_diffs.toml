# --- the generated metadata ---------------------------------------------------------------------
# `vdjdb.meta.txt` and `vdjdb.slim.meta.txt` stopped being generated when the Groovy was retired,
# and the static git copies then drifted from the data they describe. Both are generated from the
# field registry again, which is why they differ from the ones in the zip.
#
# Keyed on the column name, not the line number, so the inserted row is one added row rather than
# every row after it reading as changed. The order the rows are written in is pinned by
# `test_header_is_the_name_column_of_the_metadata`, and by `_compare_table` failing a reordered
# header; measured 2026-09-27, the candidate's `vdjdb.txt`, `vdjdb.slim.txt` and `vdjdb_full.txt`
# headers are identical to the reference's, field for field.

# `TCR_hash` is column 15 of the release's own `vdjdb.txt` and has no row in the release's meta
# file. `vdjdb-web` builds its schema from the meta file, so a column the data carries and the meta
# omits is the drift hard rule 2 exists to stop.
[[row_delta]]
file = "vdjdb.meta.txt"
added = 1
removed = 0
note = "the TCR_hash row, missing from the shipped metadata"

[[row_delta]]
file = "vdjdb.slim.meta.txt"
added = 1
removed = 0
note = "the TCR_hash row, missing from the shipped metadata"

# Production serves `Info`, not `Score`. Read from the deployed metadata in
# `vdjdb-web/test/resources/database/vdjdb.meta.txt`, whose 27 rows are the schema the site runs;
# the frontend then retitles this column again to `Evidence` on the annotations page
# (`annotations.service.ts:457`). The zip's `Score` is the pre-rename spelling.
[[rule]]
id = "meta-score-title-info"
file = "vdjdb.meta.txt"
column = "line"
from = "vdjdb.score\ttxt\t1\t1\t0\tuint\tScore\tVDJdb confidence score, the higher is the score the more confidence we have in the antigen specificity annotation of a given TCR clonotype/clone. Zero score indicates that there are insufficient method details to draw any conclusion."
to = "vdjdb.score\ttxt\t1\t1\t0\tuint\tInfo\tVDJdb confidence score, the higher is the score the more confidence we have in the antigen specificity annotation of a given TCR clonotype/clone. Zero score indicates that there are insufficient method details to draw any conclusion."
rows = 1

# The four internal `web.*` rows are shipped with their fields shifted one place left from
# `autocomplete` on: `autocomplete` holds 1, `data.type` holds `0`, `title` holds `factor`,
# `comment` holds `Internal`, and there is no comment. The shift is in
# `attic/BuildDatabase.groovy:368-371` too, so it is as old as the generator. `web.method` is worse
# again: a space where the first tab belongs, which makes `type` read as `txt 0` and the row seven
# fields wide.
#
# What the fix changes for `vdjdb-web`, read from the consumer rather than assumed
# (`DatabaseColumnInfo.scala:37`, `DatabaseMetadata.scala:53-66`): `autocomplete == "1"` is what
# copies a column's full value list into the metadata JSON sent to the browser, and `data.type`,
# `title` and `comment` are read straight off the row. All four of these columns carry
# `visible = 0`, and `createFromInstance` drops every invisible column before serialising, so none
# of those values ever reaches a client. The shift is inert there; removing it stops four value
# lists being materialised and thrown away.
[[rule]]
id = "meta-web-method-field-shift"
file = "vdjdb.meta.txt"
column = "line"
from = "web.method\ttxt 0\t0\t1\t0\tfactor\tInternal"
to = "web.method\ttxt\t0\t0\t0\tfactor\tInternal\tInternal: coarse identification method for fast filtering."
rows = 1

[[rule]]
id = "meta-web-method-seq-field-shift"
file = "vdjdb.meta.txt"
column = "line"
from = "web.method.seq\ttxt\t0\t0\t1\t0\tfactor\tInternal"
to = "web.method.seq\ttxt\t0\t0\t0\tfactor\tInternal\tInternal: coarse sequencing method for fast filtering."
rows = 1

[[rule]]
id = "meta-web-cdr3fix-nc-field-shift"
file = "vdjdb.meta.txt"
column = "line"
from = "web.cdr3fix.nc\ttxt\t0\t0\t1\t0\tfactor\tInternal"
to = "web.cdr3fix.nc\ttxt\t0\t0\t0\tfactor\tInternal\tInternal: CDR3 has non-canonical V or J anchor residues."
rows = 1

[[rule]]
id = "meta-web-cdr3fix-unmp-field-shift"
file = "vdjdb.meta.txt"
column = "line"
from = "web.cdr3fix.unmp\ttxt\t0\t0\t1\t0\tfactor\tInternal"
to = "web.cdr3fix.unmp\ttxt\t0\t0\t0\tfactor\tInternal\tInternal: CDR3 could not be mapped onto V or J germline."
rows = 1

# --- feature/arda-cdr3fix: the melt ambiguity, in the paired format ----------------------------
# The same defect the `legacy-melt-ambiguity-*` rules above declare for `vdjdb.txt`, reaching
# `vdjdb_full.txt` once arda repairs the CDR3s. Two records of one paper that the comparison key
# cannot tell apart are paired arbitrarily, and the legacy build assigned their annotations in
# chunk-read order -- `runBuidDatabase.py` iterated `os.listdir`, so that order was the host's.
#
# Verified rather than assumed: every differing cell in each column below sits in an identity group
# holding more than one record on BOTH sides, and the two sides carry the same set of values in a
# different order. `8VCX` against `8vcx` is one complex spelled two ways in one chunk; `28mo`
# against `13days` is two donors of PMID:11046006 swapped between two rows.
#
# These fire only on cells no earlier rule attributes, because a cell is attributed to the first
# rule that matches it.
[[rule]]
id = "melt-ambiguity-full-method-sequencing"
file = "vdjdb_full.txt"
column = "method.sequencing"
rows = 17

[[rule]]
id = "melt-ambiguity-full-cell-subset"
file = "vdjdb_full.txt"
column = "meta.cell.subset"
rows = 16

[[rule]]
id = "melt-ambiguity-full-singlecell"
file = "vdjdb_full.txt"
column = "method.singlecell"
rows = 15

[[rule]]
id = "melt-ambiguity-full-tissue"
file = "vdjdb_full.txt"
column = "meta.tissue"
rows = 15

[[rule]]
id = "melt-ambiguity-full-replica-id"
file = "vdjdb_full.txt"
column = "meta.replica.id"
rows = 5

[[rule]]
id = "melt-ambiguity-full-verification"
file = "vdjdb_full.txt"
column = "method.verification"
rows = 3

[[rule]]
id = "melt-ambiguity-full-structure-id"
file = "vdjdb_full.txt"
column = "meta.structure.id"
rows = 0


# --- feature/arda-cdr3fix: why 10,605 rows of vdjdb.txt change identity -------------------------
# `v.segm` and `j.segm` are in the comparison key, so a row whose segment call changes reads as one
# row leaving and another arriving. There is no cell to attribute and the row_delta declarations
# above carry the count.
#
# The cause is not that arda is less careful than the k-mer scanner it replaces. It is the reverse,
# and it was measured chain by chain on the build's own key -- one row per (record_id, gene), so
# there is no pairing guesswork -- by building the same corpus twice, `--engine legacy` against
# `--engine arda`, over 286,047 chains:
#
#   | measure                                             |   legacy |     arda |
#   |-----------------------------------------------------|---------:|---------:|
#   | `v.end` located                                     |  278,710 |  280,095 |
#   | `j.start` located                                   |  277,939 |  284,880 |
#   | V calls disagreeing with the curator's SPECIFIC gene |   2,895 |        0 |
#   | J calls disagreeing with the curator's SPECIFIC gene |     345 |        0 |
#
# The last two rows are the finding. Where the chunk names a specific gene and the two engines
# disagree, arda names the gene the curator reported on **2,895 of 2,895** V calls and **345 of 345**
# J calls, and the k-mer scanner names it on **none** of them: it answers `TRBV6-1*01` to a submitted
# `TRBV6-7`, `TRBV7-2*01` to `TRBV7-1`, `TRBJ1-1*01` to `TRBJ1-6`. So every release up to
# 2026-06-03 ships a gene the publication did not report on those chains, and correcting it is what
# moves the rows.
#
# The remaining segment differences are resolutions rather than contradictions: 2,592 V and 2,053 J
# where both engines name the same gene and a different allele of it, and 2,276 V / 353 J where the
# chunk gave a family with no gene number and the two engines picked different members.
#
# `chains` keeps `v.segm.submitted` and `v.segm.arda` beside the shipped `v.segm`, so this is
# auditable from the tables rather than only from this comment.

# --- proofread/561: 98 alpha chains leave, and the records keep their beta ----------------------
# `cdr3.alpha` held a copy of the beta CDR3 on 98 records of three references (#561), so it was
# cleared. A chain row needs a CDR3, so those 98 alpha chains leave the chain table and `vdjdb.txt`,
# which melts one row per chain, is 98 rows shorter: 284,546 -> 284,448. `vdjdb_full.txt` is
# unchanged at 192,753 because it is one row per record and every one of those records keeps its
# beta chain, which is the point of clearing the cell rather than dropping the row.
#
# The 98 are inside the `removed` count declared for `vdjdb.txt` above, not a separate rule: there is
# no changed cell to attribute when a row simply is not there.
