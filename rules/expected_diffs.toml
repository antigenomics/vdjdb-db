# #714. IMGT's mouse `TRBV10` is a pseudogene with no Cys104 anchor, so the 155 rows calling it shipped
# `vEnd = -1`, `FailedBadSegment` and no `cdr3nt` at all. `TRBV4` is the only functional mouse TRBV gene
# absent from all 5 files that name `TRBV10` and present in 14 of the 18 that never do (Fisher exact,
# two-sided, p = 3.74e-3), and its position-5 junction profile is the nearest neighbour to `TRBV10`'s
# (Jensen-Shannon 0.2668 against 0.3261 for the runner-up) because both template `CASS` and stop.
#
# Scoped to mouse, for the reason this file's `TRAV14-1*01` case records (#671): human `TRBV10` is 33
# reference rows and is genuinely ambiguous between `-1`, `-2` and `-3`, and `MacacaMulatta` has 10
# more. An unscoped rewrite would key 43 rows against a gene that is not theirs.
[[rename]]
columns = "v.beta,v.segm"
species = "MusMusculus"
from = "TRBV10"
to = "TRBV4*01"
records = 155

