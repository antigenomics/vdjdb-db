# Declared differences between a candidate build and the reference release.
#
# Every changed cell must match a rule here, AND every rule must fire exactly its declared `rows`
# count. The second half is what makes a rule a measurement rather than a description: without it,
# a regression that happened to touch a declared column would pass silently.
#
# Omit `rows` only where a count is genuinely not yet measured; such a rule attributes cells but
# does not gate. Every rule should carry one by the time its phase merges.
#
# Phase 2 ships this file EMPTY on purpose: the current build must diff to zero before any
# behaviour change lands, or there is no instrument to attribute later differences with.

# --- phase 1, feature/schema: the generated metadata fixes three shipped defects ---------------
# Enable these when phase 4 starts emitting generated metadata. Until then the build still ships
# the static files and they must not fire.
#
# [[rule]] id = "meta-tcr-hash-row"    file = "vdjdb.meta.txt"      column = "line"
# [[rule]] id = "meta-score-position"  file = "vdjdb.meta.txt"      column = "line"
# [[rule]] id = "slim-meta-tcr-hash"   file = "vdjdb.slim.meta.txt" column = "line"

# --- phase 4, feature/pipeline-core -----------------------------------------------------------
# jStart == -1 is truthy in Python, where the Groovy tested jStart > -1, so unmapped records are
# labelled mapped. 7,998 of 284,546 rows; see ROADMAP section 7.
#
# [[rule]] id = "web-unmp-jstart-minus1" file = "vdjdb.txt" column = "web.cdr3fix.unmp"
#          from = "no" to = "yes" rows = 7998

# --- issue #402: meta.structure.id is a TCR:pMHC PDB entry or it is blank ----------------------
# Declared first, because these cells would otherwise be absorbed by the melt-ambiguity and
# nomenclature rules below, which are named for other causes: `vdjdb diff` attributes a changed
# cell to the first matching rule, so a rule has to precede the ones it takes cells from. Each one
# here is narrowed by `to` or by `from`/`to` so it claims only the cells this change caused and
# leaves the rest to those rules, which keep their own identity at a re-measured count.
#
# The field awards `vdjdb.score` 3 outright - above every sequencing and specificity term, because
# a solved TCR:pMHC complex is direct proof of binding - and 2,765 chunk rows held a figure or
# table reference in it. Every value is now either a current `tcrpmhc` entry in the
# ~/hf/tcren_structures/pdb_catalogue typing of the PDB, or empty: 2,765 non-PDB strings blanked,
# 55 rows on entries that carry no TCR or no longer exist blanked, 9 moved to the entry that
# actually holds the record's receptor, 368 upper-cased so the 27 ids written in two cases become
# one value. 3,220 cells in seven chunks.
#
# The id change is the cause and the score change is the consequence, so they are measured apart,
# and the score rules are split by transition because that is what a reader wants to know: 6,366
# `vdjdb.txt` cells go 3 -> 0, 1,685 go 3 -> 1 and 188 go 3 -> 2. Records at score 3 fall from
# 6,007 to 1,791, and all 382 that still carry a structure id are at 3.
#
# Two older rules fall to 0 as a result and keep their declarations: `legacy-melt-ambiguity-meta`
# and `melt-ambiguity-full-structure-id` both describe melt ambiguity *in this same field*, and
# once the field is repaired there is no residual ambiguity in it to attribute. They are not
# deleted, because they would fire again the moment the ambiguity returned.
[[rule]]
id = "structure-id-repaired-default"
file = "vdjdb.txt"
column = "meta"
json_field = "structure.id"
rows = 4296

[[rule]]
id = "structure-id-blanked-full"
file = "vdjdb_full.txt"
column = "meta.structure.id"
to = ""
rows = 2174

[[rule]]
id = "structure-id-respelled-full"
file = "vdjdb_full.txt"
column = "meta.structure.id"
rows = 342

[[rule]]
id = "structure-id-score-default-to-0"
file = "vdjdb.txt"
column = "vdjdb.score"
from = "3"
to = "0"
rows = 6366

[[rule]]
id = "structure-id-score-default-to-1"
file = "vdjdb.txt"
column = "vdjdb.score"
from = "3"
to = "1"
rows = 1685

[[rule]]
id = "structure-id-score-default-to-2"
file = "vdjdb.txt"
column = "vdjdb.score"
from = "3"
to = "2"
rows = 188

[[rule]]
id = "structure-id-score-full-to-0"
file = "vdjdb_full.txt"
column = "vdjdb.score"
from = "3"
to = "0"
rows = 3798

[[rule]]
id = "structure-id-score-full-to-1"
file = "vdjdb_full.txt"
column = "vdjdb.score"
from = "3"
to = "1"
rows = 985

[[rule]]
id = "structure-id-score-full-to-2"
file = "vdjdb_full.txt"
column = "vdjdb.score"
from = "3"
to = "2"
rows = 197

[[rule]]
id = "structure-id-score-slim-to-0"
file = "vdjdb.slim.txt"
column = "vdjdb.score"
from = "3"
to = "0"
rows = 1957

[[rule]]
id = "structure-id-score-slim-to-1"
file = "vdjdb.slim.txt"
column = "vdjdb.score"
from = "3"
to = "1"
rows = 392

[[rule]]
id = "structure-id-score-slim-to-2"
file = "vdjdb.slim.txt"
column = "vdjdb.score"
from = "3"
to = "2"
rows = 15

# --- phase 2, feature/golden-harness: the legacy format's own ambiguity -----------------------
# vdjdb.txt writes one row per chain, so a paired record's TRA row carries nothing about its beta.
# Two records sharing an alpha and differing in beta melt to two TRA rows that no single-chain key
# tells apart, and the legacy build assigns their annotations in chunk-read order. Measured over a
# rebuild with identical code and identical data: 80 of 208,447 identity groups, 162 of 6.26M
# cells. See ROADMAP section 14.
#
# These attribute without gating (no `rows`) because the count is a property of the host's readdir
# order, not of the build. The new format removes the ambiguity entirely via record ids.
# Narrowed to the fields that actually carry the ambiguity: the donor, replica, clone and
# structure annotations that CHUNK_DEDUP_KEY does not distinguish. Without `json_field`, one rule
# on `meta` would cover every member of the largest column in the database.
[[rule]]
id = "legacy-melt-ambiguity-meta"
file = "vdjdb.txt"
column = "meta"
json_field = "structure.id"
rows = 0


# The canonical complex.id numbering labels each group by its members' identities, so the same
# ambiguity shifts the numbering of neighbouring groups by one (81069 <-> 81070). Same root cause.
[[rule]]
id = "legacy-melt-ambiguity-complex-id"
file = "vdjdb.txt"
column = "complex.id"
rows = 178659

[[rule]]
id = "legacy-melt-ambiguity-cdr3fix"
file = "vdjdb.txt"
column = "cdr3fix"
rows = 17968

# --- phase 4, feature/pipeline-core -----------------------------------------------------------
# jStart == -1 is truthy in Python, where the Groovy tested jStart > -1, so unmapped records are
# labelled mapped. This is a currently-shipping data error; see ROADMAP section 7.
[[rule]]
id = "web-unmp-jstart-minus1"
file = "vdjdb.txt"
column = "web.cdr3fix.unmp"
from = "no"
to = "yes"
rows = 147

# pandas type coercion on read. The new reader keeps every cell as the string a curator typed, so
# these are all corrections of a lossy round-trip -- the reference value is the damaged one.
#
#   meta.epitope.id   44920.0  <- 44920    an integer id read as a float
#   meta.clone.id     3.0      <- 3        same
#   meta.subject.id   2        <- 002      a zero-padded id read as an integer
#   method.frequency  0.0032333393209987 <- 0.0032333393209987428   float repr truncation
[[rule]]
id = "pandas-float-epitope-id"
file = "vdjdb_full.txt"
column = "meta.epitope.id"
rows = 10117

[[rule]]
id = "pandas-float-clone-id"
file = "vdjdb_full.txt"
column = "meta.clone.id"
rows = 23

[[rule]]
id = "pandas-int-subject-id"
file = "vdjdb_full.txt"
column = "meta.subject.id"
rows = 52

[[rule]]
id = "pandas-float-frequency-full"
file = "vdjdb_full.txt"
column = "method.frequency"
rows = 189

# The same truncation, seen through the method JSON of vdjdb.txt.
[[rule]]
id = "pandas-float-frequency-json"
file = "vdjdb.txt"
column = "method"
rows = 1644

# `NA` is influenza neuraminidase, a real gene symbol. pandas read it as a missing value, and
# `if NaN:` is True in Python, so the legacy assigned the missing value and blanked the gene.
[[rule]]
id = "pandas-na-gene-symbol"
file = "vdjdb_full.txt"
column = "antigen.gene"
rows = 10348

# The same pandas coercions seen through the meta JSON of vdjdb.txt -- and there they are worse,
# because the damage reaches the JSON *type*. pandas inferred these identifier columns as numbers,
# so the release serialises `"subject.id": 3` where the curator wrote `3`, and `"subject.id": "002"`
# where they wrote `002`: the same field is a JSON number on one row and a JSON string on the next,
# and a consumer cannot tell which without checking. Identifiers are strings; the new reader keeps
# every cell as typed.
[[rule]]
id = "json-id-type-subject"
file = "vdjdb.txt"
column = "meta"
json_field = "subject.id"
rows = 41952

[[rule]]
id = "json-id-type-epitope"
file = "vdjdb.txt"
column = "meta"
json_field = "epitope.id"
rows = 10931

[[rule]]
id = "json-id-type-replica"
file = "vdjdb.txt"
column = "meta"
json_field = "replica.id"
rows = 2810

[[rule]]
id = "json-id-type-clone"
file = "vdjdb.txt"
column = "meta"
json_field = "clone.id"
rows = 64

[[rule]]
id = "pandas-na-gene-symbol-melted"
file = "vdjdb.txt"
column = "antigen.gene"
rows = 14966

# --- declared row deltas -----------------------------------------------------------------------
# vdjdb.slim.txt groups on antigen.gene, so restoring the influenza neuraminidase symbol `NA` --
# which pandas read as a missing value and blanked -- moves 14 records to a different group. There
# is no cell to attribute: one row leaves and another arrives.
[[row_delta]]
file = "vdjdb.slim.txt"
added = 9295
removed = 9387
note = "pandas-na-gene-symbol seen through the slim grouping key (750/809) + the arda markup engine (see the arda-cdr3fix block below) + PMID_18025130 landing (#161): 40 records arrive, 33 of them as new slim groups and 7 joining groups that already existed, which rekeys those 7 + PMID_15753288 Arden conversion (#302), 35 V calls rekeying 12 slim groups + #597 (PMID:29895573 `FLRGRAYGL`, PMID:36121440 `RPPIFIRRL`), 94 `mhc.a` corrections rekeying 82 slim groups"

# The melt ambiguity of ROADMAP section 14, seen as rows rather than cells: where two
# indistinguishable records swap, best-match pairing sometimes leaves one on each side. 780 of
# these; the rest are the markup engine, see the block at the end of this file.
[[row_delta]]
file = "vdjdb.txt"
added = 11515
removed = 11573
note = "legacy melt ambiguity (780) + the arda markup engine naming the segment the curator reported (10,605; see the arda-cdr3fix block below) + PMID_18025130 landing (#161), 40 records + PMID_15753288 Arden conversion (#302), 35 V calls rekeying 15 records + #597 (PMID:29895573 `FLRGRAYGL`, PMID:36121440 `RPPIFIRRL`), 94 `mhc.a` corrections rekeying 82 records"


