# --- ROADMAP phase 9: IMGT segment nomenclature (#389) ------------------------------------------
# Every rule below is a *consequence* of rewriting a segment name, not a second change. The rewrites
# themselves are the generated `[[rename]]` block; these are what they cascade into.
#
# Seven counts across this file and the melt-ambiguity block moved by 5 to 7 rows on 2026-09-29 for
# one reason: the mouse TRAJ47 allele correction (#647) rewrites `j.alpha` on 95 records, `j.segm` is
# part of the identity key, and 6 of their 90 distinct record keys were still matched against the
# reference. Those 6 leave the changed-cell pool for the row buckets, so five counts fall; the two
# `TCR_hash` counts rise, because the hash is computed over the segment call and rows that were
# identical on it now differ. All seven are re-measured, not slackened.

[[rule]]
id = "nomenclature-slim-complex-id-renumber"
file = "vdjdb.slim.txt"
column = "complex.id"
rows = 107126

[[rule]]
id = "nomenclature-vend-full-alpha"
file = "vdjdb_full.txt"
column = "cdr3fix.alpha"
rows = 6334

[[rule]]
id = "nomenclature-vend-full-beta"
file = "vdjdb_full.txt"
column = "cdr3fix.beta"
rows = 6232

# 5,404 before the arda 2.31 bump. Two slim rows now agree with the reference: arda places a `v.end`
# on alleles whose IMGT germline record is truncated instead of answering -1 (`antigenomics/arda#135`),
# and on two of these the boundary it places is the one the reference shipped. 1,144 chains change
# `v.end` in total, but the other 1,142 sit on rows whose `v.segm` the nomenclature phase already
# rekeys, so they have no reference cell to compare and are counted in the row buckets below.
[[rule]]
id = "nomenclature-vend-slim"
file = "vdjdb.slim.txt"
column = "v.end"
rows = 4434

[[rule]]
id = "nomenclature-jstart-slim"
file = "vdjdb.slim.txt"
column = "j.start"
rows = 6065

[[rule]]
id = "nomenclature-now-mapped"
file = "vdjdb.txt"
column = "web.cdr3fix.unmp"
from = "yes"
to = "no"
rows = 4591

[[rule]]
id = "nomenclature-tcr-hash-default"
file = "vdjdb.txt"
column = "TCR_hash"
rows = 10406

[[rule]]
id = "nomenclature-tcr-hash-slim"
file = "vdjdb.slim.txt"
column = "TCR_hash"
rows = 6920

[[rule]]
id = "nomenclature-tcr-hash-full"
file = "vdjdb_full.txt"
column = "TCR_hash"
rows = 1007

# #681. A J call the junction does not support is replaced by the gene that it does, so a record
# joins the group of the signature it should always have been in, and that group's study count rises.
# 4 records of `GLCTLVAML` / `CAEDNNARLMF`, from 3 studies to 4. Only `studies.found` moves.
[[rule]]
id = "j-rule-studies-found"
file = "vdjdb.txt"
column = "meta"
json_field = "studies.found"
rows = 3090

[[rule]]
id = "nomenclature-samples-found"
file = "vdjdb.txt"
column = "meta"
json_field = "samples.found"
rows = 2208

[[rule]]
id = "nomenclature-d-multicall-order"
file = "vdjdb_full.txt"
column = "d.beta"
rows = 35

# The confidence score is the maximum over a signature that includes `v.alpha`, so correcting a V
# name regroups records: 2 gain a score from a neighbour they now share a signature with, and 3 lose
# one they were being credited with by a record that is not in fact the same clonotype. Both
# directions are the same correction, and the losses are the more interesting half.
[[rule]]
id = "nomenclature-score-regrouped-default"
file = "vdjdb.txt"
column = "vdjdb.score"
rows = 217

[[rule]]
id = "nomenclature-score-regrouped-full"
file = "vdjdb_full.txt"
column = "vdjdb.score"
rows = 100


# --- ROADMAP phase 9: input hygiene ------------------------------------------------------------
# Leading and trailing whitespace is never meaningful in a TSV cell, and it silently forks a value
# in two -- `tetramer-sort ` beside `tetramer-sort`. Stripped in the reader, so every column is
# affected at once; these are the cells where the released file carried the untrimmed form.

[[rule]]
id = "whitespace-meta-donor-mhc-json"
file = "vdjdb.txt"
column = "meta"
json_field = "donor.MHC"
rows = 318

[[rule]]
id = "whitespace-meta-donor-mhc"
file = "vdjdb_full.txt"
column = "meta.donor.MHC"
rows = 319

[[rule]]
id = "whitespace-meta-subject-cohort"
file = "vdjdb_full.txt"
column = "meta.subject.cohort"
rows = 0

# Two causes, one column, and they cannot be told apart cell by cell - a rule matches on file,
# column and optionally the values, and both causes rewrite arbitrary text - so this is one rule
# with both named rather than two rules where the first would silently take the other's cells.
#
#   101 whitespace differences, which is what it held when it was called
#       `whitespace-method-identification`;
# + 2,120 from #637's token vocabulary. `method.identification` is a comma-separated **set of
#       tokens**, so the unit of correction is the token: 46 distinct tokens over 56 distinct cells,
#       9 of them the ones `docs/standards/chunk-format.md` declares.
#       `proofreading/method_vocabulary.tsv` settles all 46 and its 12 `alias` rows rewrite 4,644
#       records. Four of the twelve (`tetramer.sort`, `Tetramer-sort`, `tetramer sort`,
#       `antigen loaded targets`) moved here from `proofreading/vocabulary.tsv` and were already
#       applied, so 2,120 is the eight new ones.
[[rule]]
id = "method-identification-corrections"
file = "vdjdb_full.txt"
column = "method.identification"
rows = 2122

# The confidence score is a maximum over a signature that does not contain `antigen.gene`, but the
# slim table groups on it -- so merging two spellings of one gene merges two slim rows, and the
# survivor carries the higher of their scores.
[[rule]]
id = "patch-antigen-score-slim"
file = "vdjdb.slim.txt"
column = "vdjdb.score"
rows = 5

[[rule]]
id = "patch-antigen-gene-default"
file = "vdjdb.txt"
column = "antigen.gene"
rows = 0

[[rule]]
id = "patch-antigen-gene-full"
file = "vdjdb_full.txt"
column = "antigen.gene"
rows = 0

[[rule]]
id = "patch-antigen-species-default"
file = "vdjdb.txt"
column = "antigen.species"
rows = 2

[[rule]]
id = "patch-antigen-species-full"
file = "vdjdb_full.txt"
column = "antigen.species"
rows = 1

[[rule]]
id = "patch-antigen-gene-slim"
file = "vdjdb.slim.txt"
column = "antigen.gene"
rows = 0

[[rule]]
id = "patch-antigen-species-slim"
file = "vdjdb.slim.txt"
column = "antigen.species"
rows = 0

# BEGIN generated renames -- `vdjdb rules` writes this block; review it, do not edit it
# A rename may carry `species`, and `vdjdb diff` then rewrites only that organism's rows. Empty
# means every organism, which is safe while `from` is a spelling nobody uses correctly and wrong the
# moment it is a real gene somewhere else. One entry below was in the second case:
# `TRAV14-1*01 -> TRAV14/DV4*01` is declared for 1 human record, and `TRAV14-1*01` is the correct
# IMGT name of 79 mouse records in the same release, so unscoped it keyed 79 mouse rows against a
# gene that is not theirs. Scoping it is what drops 69 records out of the `vdjdb_full.txt` row
# buckets below: they are matched again, so the comparison measures them rather than losing them.
# `test_no_declared_rename_reaches_a_species_it_does_not_name` is the gate. #671.
