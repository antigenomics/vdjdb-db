# --- feature/arda-cdr3fix: why 10,605 rows of vdjdb.txt change identity -------------------------
# `v.segm` and `j.segm` are in the comparison key, so a row whose segment call changes reads as one
# row leaving and another arriving. There is no cell to attribute and the row_delta declarations
# above carry the count.
#
# The cause is not that arda is less careful than the k-mer scanner it replaces. It is the reverse,
# and it was measured chain by chain on the build's own key -- one row per (record_id, gene), so
# there is no pairing guesswork -- by building the same corpus twice, `--engine legacy` against
# `--engine arda`, over 286,047 chains:
#
#   | measure                                             |   legacy |     arda |
#   |-----------------------------------------------------|---------:|---------:|
#   | `v.end` located                                     |  278,710 |  280,095 |
#   | `j.start` located                                   |  277,939 |  284,880 |
#   | V calls disagreeing with the curator's SPECIFIC gene |   2,895 |        0 |
#   | J calls disagreeing with the curator's SPECIFIC gene |     345 |        0 |
#
# The last two rows are the finding. Where the chunk names a specific gene and the two engines
# disagree, arda names the gene the curator reported on **2,895 of 2,895** V calls and **345 of 345**
# J calls, and the k-mer scanner names it on **none** of them: it answers `TRBV6-1*01` to a submitted
# `TRBV6-7`, `TRBV7-2*01` to `TRBV7-1`, `TRBJ1-1*01` to `TRBJ1-6`. So every release up to
# 2026-06-03 ships a gene the publication did not report on those chains, and correcting it is what
# moves the rows.
#
# The remaining segment differences are resolutions rather than contradictions: 2,592 V and 2,053 J
# where both engines name the same gene and a different allele of it, and 2,276 V / 353 J where the
# chunk gave a family with no gene number and the two engines picked different members.
#
# `chains` keeps `v.segm.submitted` and `v.segm.arda` beside the shipped `v.segm`, so this is
# auditable from the tables rather than only from this comment.

# --- proofread/561: 98 alpha chains leave, and the records keep their beta ----------------------
# `cdr3.alpha` held a copy of the beta CDR3 on 98 records of three references (#561), so it was
# cleared. A chain row needs a CDR3, so those 98 alpha chains leave the chain table and `vdjdb.txt`,
# which melts one row per chain, is 98 rows shorter: 284,546 -> 284,448. `vdjdb_full.txt` is
# unchanged at 192,753 because it is one row per record and every one of those records keeps its
# beta chain, which is the point of clearing the cell rather than dropping the row.
#
# The 98 are inside the `removed` count declared for `vdjdb.txt` above, not a separate rule: there is
# no changed cell to attribute when a row simply is not there.

# --- retiring `res/` (#658): a better J proposal, and what it moves --------------------------------
# A record that names no J gets one proposed, because `arda.cdr3fix` repairs a junction against a
# named germline and the legacy export drops a chain with no V and no J. That proposal came from a
# k-mer scan over `res/segments.txt`, a 2023 by-product of an IMGT import; it now comes from the
# recombination model, falling back to arda's own germline anchor table where the model declines.
#
# Measured over 285,989 chains: `j.segm` blank falls from 630 to 283 and `j.start` unmapped from 1,164
# to 817, so 347 chains gain a J call. 11 sequences are repaired as a consequence - all the same
# defect, a `TRBJ2-1` junction missing its second Phe (`CASSQEVAGATGELF` -> `...GELFF`), which is the
# #646 shape and could not be seen while the J was unnamed.
#
# Row counts: `vdjdb.txt` 284,488 -> 284,957 (+469) and `vdjdb.slim.txt` 197,637 -> 198,011 (+374),
# which are the chains that now pass the legacy "a CDR3 needs a V and a J" filter. `vdjdb_full.txt`
# is unchanged at 192,793: it is one row per record, and every one of those records already shipped.
#
# Every miscount this caused is re-declared above rather than explained away, and there are 21 of
# them, because `j.segm` sits in the comparison key three ways at once: a changed J call moves a row
# between the `only ref` and `only cand` buckets, a new row joins the keyed intersection and every
# rule counting cells in it gains or loses rows, and the slim grouping key renumbers `complex.id`.
# The largest movers are `nomenclature-slim-complex-id-renumber` (117,608 -> 115,192) and
# `legacy-melt-ambiguity-complex-id` (178,687 -> 179,309).
#
# **The V proposal is deliberately not part of this.** It never shipped - the k-mer scanner's V half
# returned "" on every sequence - and it still does not: `v.segm` blank stays at 745. A V recovered
# from a junction alone is right 23.8-50.1 % of the time at gene level against a J's 93.6-97.5 %, so
# it is reported as `v.inferred` (706 chains) and nowhere else. `vdjdb.annotate.cdr3fix.markup` holds
# the measurement.

# --- #646: repairing 4,324 junctions in the chunks moves the cdr3fix blob, not the sequence ---------
# The chunks now hold the junction the build was repairing on the way through, so `arda.cdr3fix` has
# nothing to fix on those chains and the blob records that: `cdr3_old` empties, `fixNeeded` goes false,
# and `vFixType` / `jFixType` go `FixAdd` or `FixTrim` -> `NoFixNeeded`. The shipped `cdr3` does not
# move at all - the repair applied is the one the engine already produced, which is how it was chosen.
#
# `vEnd` and `jStart` do move, and toward the truth. arda's repair branches set the boundary from the
# germline's whole `templated_aa` rather than the part that aligns, so a repaired junction's coordinate
# over-credits the germline by the residues it added: `CAARITGEKLF` on `TRBJ1-4*01` reports jStart 5
# where the same repaired `CAARITGEKLFF` read directly reports 7, and 7 is right (`TNEKLFF` is 7
# residues, `EKLFF` is what aligns, 12 - 5 = 7). Filed as antigenomics/arda#140. Repairing the chunk
# takes those chains off the repair branch, so the coordinate comes out the way it does for every
# record that never needed fixing.
#
#   legacy-melt-ambiguity-cdr3fix   17,966 -> 18,397   (+431)
#   nomenclature-vend-full-alpha    10,464 -> 10,573   (+109)
#   nomenclature-vend-full-beta      7,373 ->  7,655   (+282)
#   nomenclature-jstart-slim        11,179 -> 11,165    (-14)
#
# No row bucket moves and no other rule's count changes: `cdr3` is in the comparison key and it is
# unchanged, so nothing is rekeyed. `records` and `chains` hold at 192,793 and 285,989.

# --- #646 second pass: 514 corrupt anchors substituted, and 30 records merge ----------------------
# The first pass added a missing anchor or trimmed framework and never changed a residue. This one
# replaces the anchor residue itself with the one the germline of the named segment encodes, so the
# shipped `cdr3` moves on 514 chains - and `cdr3` is in the comparison key, which is why twenty rule
# counts and all three row buckets move with it rather than four cells.
#
# **30 records merge.** A base-call error at a conserved anchor made one clone look like two: once the
# anchor is right, 33 rows duplicate a sibling inside their own chunk and deduplication collapses them,
# while 3 whose amendment was ambiguous take new ids. `records` 192,793 -> 192,763 and `chains`
# 285,989 -> 285,950. That is the repair working, not a loss: the retired ids are recorded in
# `registry/records.tsv` with their amendment trail, and the surviving record carries the same
# observation.
#
# `out/reports/anchors.tsv` falls from 1,635 non-canonical chains to 1,132 and from 773
# germline-supported repairs to 261, which is the regression check #646 asks for.
#
# The counts that move furthest are the ones keyed on identity rather than on a cell:
# `legacy-melt-ambiguity-complex-id` 179,309 -> 179,037 and `nomenclature-samples-found` 1,564 ->
# 1,809, because `samples.found` counts records sharing a signature and merging two changes it for
# every record in that signature's group.

# --- the bundle's member list ------------------------------------------------------------------
# Members this release ships that the reference does not, and members it drops. A change of shape
# is declared here or it fails: before this existed, any new member failed the file-set pass
# outright, so the only way to run the comparison was `--only` naming the reference's own members -
# which is why CI compared five legacy tables and never the two motif files it also ships.
#
# The TCREMP tables are a new method, not a new projection of an old one: `cluster_members.txt` and
# `motif_pwms.txt` still carry TCRNET's clustering in the positional order `vdjdb-web`'s
# `Motifs.scala` parses, and `vdjdb-web` already resolves the `_tcremp` pair optionally
# (ROADMAP section 2). So nothing that reads the 2026-06-03 bundle reads anything different here.
[members]
added = ["cluster_members_tcremp.txt", "motif_pwms_tcremp.txt"]
removed = []

# --- members this comparison is not the instrument for -------------------------------------------
# A member is listed here with the thing that gates it instead. It is still read, digested,
# row-counted and printed in the report; what it is exempt from is the requirement that every
# changed cell match a rule and every row bucket match a declaration.
#
# Measured on the legacy zip assembled 2026-09-29 against the 2026-06-03 release: with nothing
# declared, the comparison reported 101,877 unattributed cells and FAILED - and every one of those
# cells was in a motif file or in `latest-version.txt`, while the five legacy tables were fully
# attributed. So the honest reading was already "the tables are clean and the motif files cannot be
# compared this way", and nothing in the repository said so. The workflow's answer was `--only`
# naming the five comparable members, which is the same exemption with no reason attached and no
# record of the other seven.
[measured_elsewhere]
# The clustering is a re-implementation, and `cid` is `<species>.<chain>.<epitope>.<n>` where `n` is
# a position in a sorted list - so one renumbered cluster relabels every cluster after it. Measured:
# 32,703 of 55,636 reference rows key to nothing in the candidate, and 22,933 of the rest differ in
# `x`/`y` alone, which are graph-layout coordinates on a different scale (-496.7 against -1.35).
# What gates them instead: `vdjdb motif-metrics` scores 18 axes per chain against both the released
# clustering and a committed baseline, including `partition_neighbours_preserved`, which asks of
# every clonotype the release clustered what fraction of its cluster-mates this build still gives it
# - 0.9224 on TRB and 0.7024 on TRA as of 2026-09-29. Column count and order, which `vdjdb-web`
# parses positionally, are gated by tests/release/test_reference_contract.py.
"cluster_members.txt" = "`vdjdb motif-metrics` (18 axes incl. `partition_neighbours_preserved`) and `tests/release/test_reference_contract.py` (19 columns, fixed order)"
"motif_pwms.txt" = "`vdjdb motif-metrics` and `tests/release/test_reference_contract.py` (27 columns, fixed order). Its rows are PWM cells of a cluster, so they have no identity that survives a re-clustering"
# A fresh render on every build, and three layers already gate it: the ordered headings, tables and
# PNG dimensions decoded from the IHDR; the ColorBrewer anchors; and SSIM against the last release.
"vdjdb_summary_embed.html" = "`summary/check_summary.py` -- structural, style and perceptual layers, against `summary/fingerprint.json` and the previous release"
# Shipped verbatim from the repository root, so its bytes are that file's and this comparison has
# nothing to say about them.
"LICENSE" = "shipped verbatim from the repository root"

# PDB publication reconciliation (#71): changed reference keys move existing
# rows between comparison buckets. No source row or metadata field is dropped.
# Rule counts above were measured after retaining the separate 8RYM/8RYO references.

# #845: metadata-aware observation identity. All 192,609 previous active record IDs
# and content hashes survive unchanged; 285 previously suppressed observations return.
# The full-format comparison now keys on study, subset, cohort, subject, replica, clone
# and tissue, matching the default-format comparison. Its former Child -> Elderly
# pairing was an artefact of an underspecified key, not an edit to a source record.
# Field changes that now alter identity move into the declared row buckets; this is
# why the full-format cohort, clone, subset and replica rules fall to zero.
# The additional observations change sample/study counts and score aggregation;
# segment/markup rules apply to the newly matched rows. No slim identity groups
# are added or removed. No new unattributed-cell rule is needed.

# PMID:39982976, #416: the paper reports MHC-II-reactive CD8 observations.
[[rule]]
id = "pmid-39982976-mhc-class"
file = "vdjdb_full.txt"
column = "mhc.class"
from = "MHCI"
to = "MHCII"
rows = 27

