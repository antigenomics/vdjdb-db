# Declared differences between a candidate build and the reference release.
#
# Every changed cell must match a rule here, AND every rule must fire exactly its declared `rows`
# count. The second half is what makes a rule a measurement rather than a description: without it,
# a regression that happened to touch a declared column would pass silently.
#
# Omit `rows` only where a count is genuinely not yet measured; such a rule attributes cells but
# does not gate. Every rule should carry one by the time its phase merges.
#
# Phase 2 ships this file EMPTY on purpose: the current build must diff to zero before any
# behaviour change lands, or there is no instrument to attribute later differences with.

# --- phase 1, feature/schema: the generated metadata fixes three shipped defects ---------------
# Enable these when phase 4 starts emitting generated metadata. Until then the build still ships
# the static files and they must not fire.
#
# [[rule]] id = "meta-tcr-hash-row"    file = "vdjdb.meta.txt"      column = "line"
# [[rule]] id = "meta-score-position"  file = "vdjdb.meta.txt"      column = "line"
# [[rule]] id = "slim-meta-tcr-hash"   file = "vdjdb.slim.meta.txt" column = "line"

# --- phase 4, feature/pipeline-core -----------------------------------------------------------
# jStart == -1 is truthy in Python, where the Groovy tested jStart > -1, so unmapped records are
# labelled mapped. 7,998 of 284,546 rows; see ROADMAP section 7.
#
# [[rule]] id = "web-unmp-jstart-minus1" file = "vdjdb.txt" column = "web.cdr3fix.unmp"
#          from = "no" to = "yes" rows = 7998

# --- issue #402: meta.structure.id is a TCR:pMHC PDB entry or it is blank ----------------------
# Declared first, because these cells would otherwise be absorbed by the melt-ambiguity and
# nomenclature rules below, which are named for other causes: `vdjdb diff` attributes a changed
# cell to the first matching rule, so a rule has to precede the ones it takes cells from. Each one
# here is narrowed by `to` or by `from`/`to` so it claims only the cells this change caused and
# leaves the rest to those rules, which keep their own identity at a re-measured count.
#
# The field awards `vdjdb.score` 3 outright - above every sequencing and specificity term, because
# a solved TCR:pMHC complex is direct proof of binding - and 2,765 chunk rows held a figure or
# table reference in it. Every value is now either a current `tcrpmhc` entry in the
# ~/hf/tcren_structures/pdb_catalogue typing of the PDB, or empty: 2,765 non-PDB strings blanked,
# 55 rows on entries that carry no TCR or no longer exist blanked, 9 moved to the entry that
# actually holds the record's receptor, 368 upper-cased so the 27 ids written in two cases become
# one value. 3,220 cells in seven chunks.
#
# The id change is the cause and the score change is the consequence, so they are measured apart,
# and the score rules are split by transition because that is what a reader wants to know: 6,366
# `vdjdb.txt` cells go 3 -> 0, 1,685 go 3 -> 1 and 188 go 3 -> 2. Records at score 3 fall from
# 6,007 to 1,791, and all 382 that still carry a structure id are at 3.
#
# Two older rules fall to 0 as a result and keep their declarations: `legacy-melt-ambiguity-meta`
# and `melt-ambiguity-full-structure-id` both describe melt ambiguity *in this same field*, and
# once the field is repaired there is no residual ambiguity in it to attribute. They are not
# deleted, because they would fire again the moment the ambiguity returned.
[[rule]]
id = "structure-id-repaired-default"
file = "vdjdb.txt"
column = "meta"
json_field = "structure.id"
rows = 4133

[[rule]]
id = "structure-id-blanked-full"
file = "vdjdb_full.txt"
column = "meta.structure.id"
to = ""
rows = 2119

[[rule]]
id = "structure-id-respelled-full"
file = "vdjdb_full.txt"
column = "meta.structure.id"
rows = 272

[[rule]]
id = "structure-id-score-default-to-0"
file = "vdjdb.txt"
column = "vdjdb.score"
from = "3"
to = "0"
rows = 6174

[[rule]]
id = "structure-id-score-default-to-1"
file = "vdjdb.txt"
column = "vdjdb.score"
from = "3"
to = "1"
rows = 1437

[[rule]]
id = "structure-id-score-default-to-2"
file = "vdjdb.txt"
column = "vdjdb.score"
from = "3"
to = "2"
rows = 429

[[rule]]
id = "structure-id-score-full-to-0"
file = "vdjdb_full.txt"
column = "vdjdb.score"
from = "3"
to = "0"
rows = 3612

[[rule]]
id = "structure-id-score-full-to-1"
file = "vdjdb_full.txt"
column = "vdjdb.score"
from = "3"
to = "1"
rows = 865

[[rule]]
id = "structure-id-score-full-to-2"
file = "vdjdb_full.txt"
column = "vdjdb.score"
from = "3"
to = "2"
rows = 305

[[rule]]
id = "structure-id-score-slim-to-0"
file = "vdjdb.slim.txt"
column = "vdjdb.score"
from = "3"
to = "0"
rows = 1766

[[rule]]
id = "structure-id-score-slim-to-1"
file = "vdjdb.slim.txt"
column = "vdjdb.score"
from = "3"
to = "1"
rows = 343

[[rule]]
id = "structure-id-score-slim-to-2"
file = "vdjdb.slim.txt"
column = "vdjdb.score"
from = "3"
to = "2"
rows = 2

# --- phase 2, feature/golden-harness: the legacy format's own ambiguity -----------------------
# vdjdb.txt writes one row per chain, so a paired record's TRA row carries nothing about its beta.
# Two records sharing an alpha and differing in beta melt to two TRA rows that no single-chain key
# tells apart, and the legacy build assigns their annotations in chunk-read order. Measured over a
# rebuild with identical code and identical data: 80 of 208,447 identity groups, 162 of 6.26M
# cells. See ROADMAP section 14.
#
# These attribute without gating (no `rows`) because the count is a property of the host's readdir
# order, not of the build. The new format removes the ambiguity entirely via record ids.
# Narrowed to the fields that actually carry the ambiguity: the donor, replica, clone and
# structure annotations that CHUNK_DEDUP_KEY does not distinguish. Without `json_field`, one rule
# on `meta` would cover every member of the largest column in the database.
[[rule]]
id = "legacy-melt-ambiguity-meta"
file = "vdjdb.txt"
column = "meta"
json_field = "structure.id"
rows = 0


# The canonical complex.id numbering labels each group by its members' identities, so the same
# ambiguity shifts the numbering of neighbouring groups by one (81069 <-> 81070). Same root cause.
[[rule]]
id = "legacy-melt-ambiguity-complex-id"
file = "vdjdb.txt"
column = "complex.id"
rows = 176552

[[rule]]
id = "legacy-melt-ambiguity-cdr3fix"
file = "vdjdb.txt"
column = "cdr3fix"
rows = 12248

# --- phase 4, feature/pipeline-core -----------------------------------------------------------
# jStart == -1 is truthy in Python, where the Groovy tested jStart > -1, so unmapped records are
# labelled mapped. This is a currently-shipping data error; see ROADMAP section 7.
# 145 before the arda 2.31 bump. `unmp` needs both `vEnd > -1` and `jStart > -1`, so the two rows that
# left are rows where the reference said "mapped", this build said "unmapped" because arda declined the
# V boundary, and arda now places it (`antigenomics/arda#135`). 1,140 rows of `vdjdb.txt` flip
# "yes" -> "no" in total; the other 1,138 are on rows the nomenclature phase rekeys, so they are in the
# row buckets rather than here.
[[rule]]
id = "web-unmp-jstart-minus1"
file = "vdjdb.txt"
column = "web.cdr3fix.unmp"
from = "no"
to = "yes"
rows = 582

# --- issue #397 / #694: the B16 chunk recorded a count by repeating the row -------------------
# `Mice_TCRs_specific_to_B16_melanoma_neoantigens_(Shagina_et_al_2024).tsv` carried 1,556 rows for 485
# clonotypes - one copy per observation, up to 52 of one, with `method.frequency` blank throughout -
# and a spreadsheet autofill had turned the gene `Eef2` into the run `Eef2`..`Eef188`, one label per
# row, so 187 rows that are 65 clonotypes never deduplicated. The chunk now carries 485 rows with
# `method.frequency` as `count/sample total`, the convention 3,548 values in the corpus already use.
#
# Declared before the `pandas-float-*` and `pandas-na-gene-symbol` rules below and narrowed, for the
# reason the `meta.structure.id` block gives: those are unnarrowed on their columns and would take
# these cells under a name that describes pandas coercion rather than this.
[[rule]]
id = "b16-frequency-recorded-full"
file = "vdjdb_full.txt"
column = "method.frequency"
from = ""
rows = 0

[[rule]]
id = "b16-autofilled-gene-full"
file = "vdjdb_full.txt"
column = "antigen.gene"
to = "Eef2"
rows = 0

# A curation judgement, and the one edit here that disputes what the submitters wrote rather than
# repairing a spreadsheet: `mhcmatch`'s mouse proteome assigns `STANYNTSHLNNDVWQIFENPVDWKEK` to
# `Plod2` and finds no `Plod1` within two substitutions. The 14 epitopes are 27-mers with a single
# substitution at position 13, so the search window is the whole peptide either way.
[[rule]]
id = "b16-plod2-gene-full"
file = "vdjdb_full.txt"
column = "antigen.gene"
from = "Plod1"
to = "Plod2"
rows = 0

# `b16-autofilled-gene-melted` was here and is gone rather than re-measured to zero. `meta.subject.id`
# and `meta.subject.cohort` are both identity fields of `vdjdb.txt` (`JSON_KEYS`), so blanking the
# cohort moves every one of the chunk's 485 records into the row buckets below; nothing of this chunk
# reaches the changed-cell pool of that file any more. `vdjdb_full.txt` keys on neither, which is why
# the two rules above still fire there.

# pandas type coercion on read. The new reader keeps every cell as the string a curator typed, so
# these are all corrections of a lossy round-trip -- the reference value is the damaged one.
#
#   meta.epitope.id   44920.0  <- 44920    an integer id read as a float
#   meta.clone.id     3.0      <- 3        same
#   meta.subject.id   2        <- 002      a zero-padded id read as an integer
#   method.frequency  0.0032333393209987 <- 0.0032333393209987428   float repr truncation
[[rule]]
id = "pandas-float-epitope-id"
file = "vdjdb_full.txt"
column = "meta.epitope.id"
rows = 9770

[[rule]]
id = "pandas-float-clone-id"
file = "vdjdb_full.txt"
column = "meta.clone.id"
rows = 0

[[rule]]
id = "pandas-int-subject-id"
file = "vdjdb_full.txt"
column = "meta.subject.id"
rows = 0

[[rule]]
id = "pandas-float-frequency-full"
file = "vdjdb_full.txt"
column = "method.frequency"
rows = 174

# The same truncation, seen through the method JSON of vdjdb.txt -- and two causes share this rule,
# which the id does not say and this comment has to. `from`/`to` compare the whole JSON blob, and
# The vocabulary corrections seen inside the `method` blob. A `[[rename]]` cannot reach into JSON -
# it rewrites a column - so `vdjdb.txt`, which carries `method` as a blob rather than as columns,
# needs a rule. Declared **before** `pandas-float-frequency-json` below, which declares no
# `json_field` at all and would otherwise absorb these: `vdjdb diff` attributes a cell to the first
# matching rule, so a rule has to precede the ones it takes cells from.
# The same two causes seen through the `method` JSON blob, and one rule for the same reason:
# `json_field` tests only *which member* differs, so every `method.identification` correction is one
# cell difference here whatever produced it. 3,642 from the whole-cell vocabulary pass
# (`proofreading/vocabulary.tsv`) + 3,368 from #637's token pass
# (`proofreading/method_vocabulary.tsv`).
[[rule]]
id = "method-identification-corrections-json"
file = "vdjdb.txt"
column = "method"
json_field = "identification"
rows = 6971

# #637, and the reason the token table names four of its aliases as score-moving.
# `score/confidence.py` matches **substrings** of the lowercased `method.identification` cell -
# released semantics that must not be tightened - so a typo misses the substring it was meant to
# hit. `cultivated-t-cells` does not contain `culture`, and 62 records of `PMID_10925283.tsv` spell
# it that way, so their coarse `web.method` read `other` where the method is a cultured T-cell line.
# Correcting the spelling gives them the classification their method earns. 60 chain rows, because
# two of the 62 records report a single chain.
#
# `vdjdb.score` itself does not move on these: the culture term lowers the ceiling rather than
# raising it, and the score is a maximum over a signature these rows already reach by another term.
[[rule]]
id = "method-token-web-method"
file = "vdjdb.txt"
column = "web.method"
from = "other"
to = "culture"
rows = 50

# `json_field` tests only which member differs, so a change to `method.frequency` from pandas float
# truncation and one from recording a count are the same cell difference here. In `vdjdb_full.txt`
# they separate cleanly and are two rules, 196 and 485.
#
# 2,156 = 1,671 pandas float truncation + the B16 frequencies (#397) + changes to other members of
# `method` this rule also covers, because it declares no `json_field` at all. That last part is a
# pre-existing breadth, not something this change introduced: narrowing it is its own measurement.
#
# 1,616 before #637's token pass. Two of its cells differ in `identification` *and* in `frequency`,
# so `method-identification-corrections-json` - which declares `json_field` and is therefore ahead
# of this one - now claims them. A cell belongs to exactly one rule, and the more specific rule is
# the right owner.
[[rule]]
id = "pandas-float-frequency-json"
file = "vdjdb.txt"
column = "method"
rows = 1754

# --- issue #637 / #633: declared vocabulary corrections -----------------------------------------
# `proofreading/vocabulary.tsv` rewrites case-and-separator variants that never join the spelling
# they are a variant of - `IE-1` against 14,183 `IE1`, `tetramer.sort` against 94,700
# `tetramer-sort`. `out/reports/lookalikes.tsv` is the instrument: **19 groups over 2 columns, 9
# within one species, down to 7 and 1**, and every one of the 7 that remain is a refusal the table
# records with its reason (`MBP`/`Mbp` and `G6PC2`/`G6pc2` are both correct, HGNC capitalises and MGI
# title-cases; influenza has no `Nef`; `synthetic` is not a gene).
#
# Declared as renames rather than as rules, because that is what they are: one value corrected to
# another, applied to the reference before rows are keyed, so a spelling correction does not read as
# a lost row and a found one. `antigen.gene` is part of the slim grouping key, so 12 of them move
# slim rows as well - declared in the `vdjdb.slim.txt` row_delta.
#
# 2,516 records over 16 rewrites. `species` scopes the 5 that are only correct under one convention.


[[rename]]
columns = "antigen.gene"
from = "IE-1"
to = "IE1"
# case-and-separator variant of a 14,183-record spelling; 31 records

[[rename]]
columns = "antigen.gene"
from = "VPR"
to = "Vpr"
# case variant of a 97-record spelling; 14 records

[[rename]]
columns = "antigen.gene"
from = "gp160"
to = "GP160"
# case variant of an 89-record spelling; 30 records

[[rename]]
columns = "antigen.gene"
from = "MAGEA1"
to = "MAGE-A1"
# HGNC hyphenates the MAGE-A family; the hyphenated form is the minority here

[[rename]]
columns = "antigen.gene"
from = "MAGEA3"
to = "MAGE-A3"
# HGNC hyphenates the MAGE-A family

[[rename]]
columns = "antigen.gene"
from = "MAGEA4"
to = "MAGE-A4"
# HGNC hyphenates the MAGE-A family

[[rename]]
columns = "antigen.gene"
from = "INSDRIP"
to = "INS-DRiP"
# INS-DRiP is the published name of the defective-ribosomal-product peptide

[[rename]]
columns = "antigen.gene"
from = "YEIH"
to = "yeiH"
when_columns = "antigen.species"
when_equals = "E.Coli"
# bacterial gene symbols are lowercase with a capital final letter

[[rename]]
columns = "antigen.gene"
from = "gag"
to = "Gag"
when_columns = "antigen.species"
when_equals = "HIV-1"
# case variant of a 2,744-record spelling within one species

[[rename]]
columns = "antigen.gene"
from = "GAG"
to = "Gag"
when_columns = "antigen.species"
when_equals = "HIV-1"
# case variant of a 2,744-record spelling within one species

[[rename]]
columns = "antigen.gene"
from = "POL"
to = "Pol"
when_columns = "antigen.species"
when_equals = "HIV-1"
# case variant of a 277-record spelling within one species

[[rename]]
columns = "antigen.gene"
from = "Hexon"
to = "HEXON"
when_columns = "antigen.species"
when_equals = "HAdV5"
# case variant of the 15-record AdV spelling of the same gene

[[rename]]
columns = "method.identification"
from = "tetramer.sort"
to = "tetramer-sort"
# separator variant of a 94,700-record vocabulary value; 2,203 records

[[rename]]
columns = "method.identification"
from = "Tetramer-sort"
to = "tetramer-sort"
# case variant of a 94,700-record vocabulary value; 135 records

[[rename]]
columns = "method.identification"
from = "tetramer sort"
to = "tetramer-sort"
# separator variant of a 94,700-record vocabulary value; 5 records

[[rename]]
columns = "method.identification"
from = "antigen loaded targets, IFNg capture assay"
to = "antigen-loaded-targets, IFNg capture assay"
# separator variant of a 43-record spelling; 3 records

# --- issue #633: RGPGRAFVTI was attributed to the human proteome -------------------------------
# One row of `PDB_Database.tsv` curated the HIV-1 V3-loop peptide as `HomoSapiens` / `P18-I10`,
# against `HIV-1` / `GP160` on the other 85. `P18-I10` is the laboratory name of the peptide itself,
# so that cell held the epitope's own designation in the gene field. One line in
# `patches/antigen_epitope_species_gene.dict` answers it, and the patch is keyed on the peptide, so it
# asserts the same source for all 86.
#
# Narrowed by `from`, and declared before `pandas-na-gene-symbol` below, for the reason the
# `meta.structure.id` block already gives: `vdjdb diff` attributes a cell to the first matching rule,
# `pandas-na-gene-symbol` is unnarrowed on `antigen.gene`, and it would otherwise absorb this cell
# under a rule named for another cause. Moving the `patch-antigen-gene-*` rules above it instead would
# swallow all 10,323 of the `NA` cells, which is worse.
#
# The species half needs no new rule: nothing earlier covers `antigen.species`, so
# `patch-antigen-species-default` and `-full` claim it and move off 0 for the first time. In
# `vdjdb.slim.txt` both columns are part of the grouping key, so there the change is two rows leaving
# and two arriving rather than a cell, and it is in the row bucket.
[[rule]]
id = "antigen-gene-p18-i10-full"
file = "vdjdb_full.txt"
column = "antigen.gene"
from = "P18-I10"
to = "GP160"
rows = 1

[[rule]]
id = "antigen-gene-p18-i10-default"
file = "vdjdb.txt"
column = "antigen.gene"
from = "P18-I10"
to = "GP160"
rows = 2

# `NA` is influenza neuraminidase, a real gene symbol. pandas read it as a missing value, and
# `if NaN:` is True in Python, so the legacy assigned the missing value and blanked the gene.
[[rule]]
id = "pandas-na-gene-symbol"
file = "vdjdb_full.txt"
column = "antigen.gene"
rows = 10006

# The same pandas coercions seen through the meta JSON of vdjdb.txt -- and there they are worse,
# because the damage reaches the JSON *type*. pandas inferred these identifier columns as numbers,
# so the release serialises `"subject.id": 3` where the curator wrote `3`, and `"subject.id": "002"`
# where they wrote `002`: the same field is a JSON number on one row and a JSON string on the next,
# and a consumer cannot tell which without checking. Identifiers are strings; the new reader keeps
# every cell as typed.
[[rule]]
id = "json-id-type-subject"
file = "vdjdb.txt"
column = "meta"
json_field = "subject.id"
rows = 41100

[[rule]]
id = "json-id-type-epitope"
file = "vdjdb.txt"
column = "meta"
json_field = "epitope.id"
rows = 10586

[[rule]]
id = "json-id-type-replica"
file = "vdjdb.txt"
column = "meta"
json_field = "replica.id"
rows = 2755

[[rule]]
id = "json-id-type-clone"
file = "vdjdb.txt"
column = "meta"
json_field = "clone.id"
rows = 60

[[rule]]
id = "pandas-na-gene-symbol-melted"
file = "vdjdb.txt"
column = "antigen.gene"
rows = 14618

# --- declared row deltas -----------------------------------------------------------------------
# vdjdb.slim.txt groups on antigen.gene, so restoring the influenza neuraminidase symbol `NA` --
# which pandas read as a missing value and blanked -- moves 14 records to a different group. There
# is no cell to attribute: one row leaves and another arrives.
[[row_delta]]
file = "vdjdb.slim.txt"
added = 116894
removed = 23609
note = "Grouped remaining publications: add 42 observations, including six PMID36302754 fusion-peptide observations and 36 observations across ten further publications; four incomplete-call PMID36516854 observations remain outside legacy chain/slim projections. PMID_34290408 (#953): add 61 unpaired TRB observations; preserve 18 unresolved parent annotations in pending/. PMID_42305594 (#945): add 33 paired donor/timepoint dextramer observations; preserve four ambiguous extra-chain cells outside the build. Shared reports update slim grouping. Remaining publications (#945): PMID_42190640 adds 607 observations; PMID_42120368 adds 20 paired CEFT observations and preserves ten moved records; PMID_42624530 adds one independent donor observation and corrects 30 cohort labels. These 628 additions update shared evidence and slim grouping. PMID_42691161 (#941): add 71036 positive observations, including 28 named Table S5 experiments; preserve independent observations and shared paired-receptor/pMHC scores. Final import (#934): 23 positive chunk changes add 17674 observations; independent reports update evidence counts, scores and slim grouping. Remaining import (#893): add 12364 records from 29 supplied chunks; existing observations remain, while added reports update evidence, scores and slim grouping. PMID_36298482 (#752): add 20 paired observations and 40 chains with source-supported binding or functional responses. Original 32-row input remains excluded in pending/ for unresolved outcomes. PMID:38536748 (#762): replace preprint PMID:36711524 in 32 existing observations; publication-key amendments preserve all records and other source cells. PMID_40681176 (#768): add 26 paired observations and 52 chains from ten reported clones; shared receptor observations update slim grouping and score categories. PMID_37231180 (#756): add 13 paired source-table observations and 26 chains; shared receptor observations change study counts and score categories. The original 31-row submission remains excluded in pending/. PMID_41098775 (#772): add 19 observations and 38 chains, retaining distinct NanoPens, wells and control constructs. Shared receptor observations update slim aggregation, study counts and score categories. PMID_39982976 (#416): correct 81 I-Ab observations from MHCI to MHCII, preserving CD8 metadata and all record IDs. Class participates in legacy row identity, so affected matched rows move into row buckets and existing cell-rule counts fall. pandas-na-gene-symbol seen through the slim grouping key (750/809) + the arda markup engine (see the arda-cdr3fix block below) + PMID_18025130 landing (#161): 40 records arrive, 33 of them as new slim groups and 7 joining groups that already existed, which rekeys those 7 + PMID_15753288 Arden conversion (#302), 35 V calls rekeying 12 slim groups + #597 (PMID:29895573 `FLRGRAYGL`, PMID:36121440 `RPPIFIRRL`), 94 `mhc.a` corrections rekeying 82 slim groups - 2, the murine `I-Ab -> H2-IAb` rename keying 2 slim groups the previous spelling left unmatched + reading `;` and `+` as candidate separators and an en dash as a hyphen, 591 records over 9 spellings whose V or J call now resolves to IMGT names: mouse `TRBV12-2+TRBV13-2` (535), `TRBV3-1;TRBV3-2` (30), `TRBV12-3;TRBV12-4` (20), five one-record spellings, and one `TRBJ2` J call written with an en dash. 42 of them rekey a slim group + retiring `res/` (#658): see the res-retirement block below + the mouse TRAJ47 allele correction (#647): 95 chains read `...DYANKMIF`, the `*02` germline exactly, and none reads `*01`'s `HYANKMIC`, so all 95 are `*02` - 81 were written with no allele and 14 name `*01`. 84 of the 90 distinct record keys were already unmatched, because retiring `res/` resolved the bare calls and the #646 repairs moved the junction; the remaining 6 leave the matched set + closing the space in `PMID: 34433824` (#637): 22 records over `chunks/PMID_34433824.tsv` (20) and `chunks/PDB_Database.tsv` (2). The two spellings were two references for o